<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06111A" />
  <meta name="description" content="Axiom — تسجيل الدخول لمحرّك الحل الذكي" />
  <title>Axiom — تسجيل الدخول</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
    integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #06111a;
      --panel: rgba(5, 16, 25, 0.83);
      --panel-strong: rgba(4, 14, 22, 0.93);
      --text: #f7f4ed;
      --muted: rgba(247, 244, 237, 0.66);
      --gold: #e7b84d;
      --gold-soft: #c89134;
      --line: rgba(231, 184, 77, 0.27);
      --line-soft: rgba(255, 255, 255, 0.09);
      --blue: #1e6f9e;
      --error: #ff9a9a;
      --ok: #8fd9ac;
      --wait: #e8c07d;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: 'Tajawal', system-ui, sans-serif;
      color: var(--text);
      background: var(--bg) url('./axiom-login-bg.jpg') center center / cover no-repeat fixed;
      position: relative;
    }

    /* Dark cinematic veil: intentionally hides the promotional copy and game-board
       from the source artwork while keeping the warrior/dragon/lion visible. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        linear-gradient(90deg,
          rgba(3, 11, 17, 0.995) 0%,
          rgba(3, 11, 17, 0.98) 32%,
          rgba(3, 11, 17, 0.94) 49%,
          rgba(3, 11, 17, 0.82) 61%,
          rgba(3, 11, 17, 0.55) 72%,
          rgba(3, 11, 17, 0.12) 86%,
          rgba(3, 11, 17, 0.02) 100%),
        linear-gradient(180deg,
          rgba(2, 8, 12, 0.24) 0%,
          rgba(2, 8, 12, 0.02) 42%,
          rgba(2, 8, 12, 0.40) 100%);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 74% 48%, rgba(231, 184, 77, 0.08), transparent 28%),
        radial-gradient(circle at 18% 50%, rgba(30, 111, 158, 0.10), transparent 34%);
      mix-blend-mode: screen;
    }

    .auth-stage {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      z-index: 1;
      padding: clamp(22px, 4vw, 54px);
    }

    .auth-shell {
      width: min(470px, 100%);
      margin-inline-start: clamp(14px, 7vw, 96px);
      background: linear-gradient(160deg, rgba(7, 20, 30, 0.86), rgba(3, 12, 19, 0.94));
      border: 1px solid rgba(231, 184, 77, 0.22);
      border-radius: 24px;
      padding: clamp(26px, 4vw, 42px);
      box-shadow:
        0 36px 100px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(13px) saturate(115%);
      -webkit-backdrop-filter: blur(13px) saturate(115%);
      position: relative;
      overflow: hidden;
      animation: cardIn 0.75s var(--ease) both;
    }

    .auth-shell::before {
      content: '';
      position: absolute;
      top: 0;
      inset-inline: 13%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.9;
    }

    .auth-shell::after {
      content: '';
      position: absolute;
      width: 220px;
      height: 220px;
      top: -140px;
      inset-inline-end: -100px;
      border-radius: 50%;
      background: rgba(231, 184, 77, 0.10);
      filter: blur(35px);
      pointer-events: none;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }

    .auth-shell.shake { animation: shake 0.42s ease; }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }

    .leaf-form { position: relative; z-index: 1; }
    .leaf-form > *, .fields > * { animation: riseIn 0.6s var(--ease) both; }
    .leaf-form > *:nth-child(1) { animation-delay: .08s; }
    .leaf-form > *:nth-child(2) { animation-delay: .14s; }
    .leaf-form > *:nth-child(3) { animation-delay: .20s; }
    .leaf-form > *:nth-child(4) { animation-delay: .26s; }
    .leaf-form > *:nth-child(5) { animation-delay: .32s; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .greeting {
      margin: 0 0 9px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 9px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 0 13px rgba(231, 184, 77, 0.35));
    }

    .brand {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-size: clamp(28px, 4vw, 34px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: .05em;
      color: var(--gold);
      text-shadow: 0 0 24px rgba(231, 184, 77, .12);
      direction: ltr;
    }

    .sub {
      margin: 0 0 28px;
      max-width: 34ch;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .tabs {
      position: relative;
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--line-soft);
      margin-bottom: 8px;
    }

    .tabs button {
      flex: 1;
      padding: 12px 5px 13px;
      border: 0;
      background: transparent;
      color: rgba(247, 244, 237, .50);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: color .25s var(--ease);
    }
    .tabs button[aria-selected="true"] { color: var(--text); }

    .tab-indicator {
      position: absolute;
      bottom: -1px;
      height: 2px;
      width: 50%;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      transition: transform .35s var(--ease);
    }
    .tab-indicator[data-mode="login"] { transform: translateX(0); }
    .tab-indicator[data-mode="signup"] { transform: translateX(-100%); }

    .fields { display: flex; flex-direction: column; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 12.5px;
      font-weight: 700;
      color: rgba(247, 244, 237, .64);
    }

    .field-wrap { position: relative; }

    input {
      width: 100%;
      padding: 13px 2px 11px;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.16);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15.5px;
      transition: border-color .25s var(--ease);
    }
    input::placeholder { color: rgba(247, 244, 237, .25); }
    input:focus { outline: none; }

    .field-wrap::after {
      content: '';
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      height: 2px;
      border-radius: 3px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform .30s var(--ease), background-color .2s ease;
    }
    .field-wrap:focus-within::after { transform: scaleX(1); }
    .field-wrap.invalid::after { transform: scaleX(1); background: var(--error); }

    .field-wrap.has-eye input { padding-inline-start: 38px; }
    .toggle-eye {
      position: absolute;
      inset-inline-start: 0;
      top: 50%;
      transform: translateY(-50%);
      padding: 6px;
      border: 0;
      background: transparent;
      color: var(--text);
      opacity: .5;
      cursor: pointer;
      border-radius: 8px;
      transition: opacity .2s ease;
    }
    .toggle-eye:hover { opacity: .95; }
    .toggle-eye svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .toggle-eye .slash { stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset .25s var(--ease); }
    .toggle-eye[aria-pressed="true"] .slash { stroke-dashoffset: 0; }

    .strength {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-top: 0;
      transition: grid-template-rows .35s var(--ease), opacity .25s ease, margin .35s var(--ease);
    }
    .strength.show { grid-template-rows: 1fr; opacity: 1; margin-top: 10px; }
    .strength > div { overflow: hidden; }
    .bars { display: flex; gap: 5px; }
    .bars i {
      flex: 1;
      height: 3px;
      border-radius: 4px;
      background: rgba(247,244,237,.12);
      transition: background-color .3s var(--ease);
    }
    .strength-text { margin-top: 6px; font-size: 11.5px; color: var(--muted); }

    button.submit {
      position: relative;
      width: 100%;
      margin-top: 23px;
      padding: 14px 16px;
      border: 1px solid rgba(231, 184, 77, .48);
      border-radius: 12px;
      background: linear-gradient(135deg, #f0c65c 0%, #c58b2f 100%);
      color: #161008;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 10px 24px rgba(197, 139, 47, .16);
      transition: filter .2s ease, transform .12s ease, box-shadow .25s ease;
    }
    button.submit:hover:not(:disabled) {
      filter: brightness(1.07);
      box-shadow: 0 12px 30px rgba(197, 139, 47, .23);
    }
    button.submit:active:not(:disabled) { transform: scale(.985); }
    button.submit:disabled { opacity: .7; cursor: not-allowed; }
    button.submit.loading::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.26), transparent);
      animation: sheen 1.15s linear infinite;
    }
    @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

    .spinner {
      display: none;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(22,16,8,.25);
      border-top-color: #161008;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    button.submit.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }
    .msg:not(:empty) { animation: msgIn .35s var(--ease) both; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .msg.wait { color: var(--wait); }

    :where(button, input, a):focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
      border-radius: 6px;
    }

    @media (max-width: 900px) {
      body { background-position: 76% center; }
      body::before {
        background:
          linear-gradient(90deg,
            rgba(3,11,17,.995) 0%,
            rgba(3,11,17,.98) 48%,
            rgba(3,11,17,.82) 68%,
            rgba(3,11,17,.30) 84%,
            rgba(3,11,17,.06) 100%),
          linear-gradient(180deg, rgba(2,8,12,.18), rgba(2,8,12,.52));
      }
      .auth-stage { justify-content: center; padding: 20px; }
      .auth-shell { margin-inline-start: 0; width: min(500px, 100%); }
    }

    @media (max-width: 580px) {
      body { overflow: auto; background-position: 73% center; }
      .auth-stage { min-height: 100dvh; align-items: center; padding: 14px; }
      .auth-shell { border-radius: 20px; padding: 24px 20px 22px; }
      .brand-mark { width: 35px; height: 35px; }
      .brand { font-size: 28px; }
      .sub { margin-bottom: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="auth-stage">
    <section class="auth-shell" id="book" aria-label="Axiom authentication">
      <div class="leaf-form">
        <p class="greeting" id="greeting"></p>

        <div class="brand-lockup">
          <img class="brand-mark" src="./dragon-icon-gold.png" alt="" aria-hidden="true">
          <h1 class="brand">AXIOM</h1>
        </div>

        <p class="sub">ادخل عالم Axiom وكمّل رحلتك. سجّل دخولك أو أنشئ حساب جديد للبدء.</p>

        <div class="tabs" role="tablist" aria-label="نوع العملية">
          <button id="tabLogin" role="tab" aria-selected="true" aria-controls="authForm" type="button">تسجيل الدخول</button>
          <button id="tabSignup" role="tab" aria-selected="false" aria-controls="authForm" type="button">إنشاء حساب</button>
          <span class="tab-indicator" id="tabIndicator" data-mode="login" aria-hidden="true"></span>
        </div>

        <form class="fields" id="authForm" novalidate>
          <label for="email">البريد الإلكتروني</label>
          <div class="field-wrap" id="emailWrap">
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required />
          </div>

          <label for="password">كلمة المرور</label>
          <div class="field-wrap has-eye" id="passwordWrap">
            <button type="button" class="toggle-eye" id="togglePassword" aria-pressed="false" aria-label="إظهار كلمة المرور" aria-controls="password">
              <svg viewBox="0 0 24 24">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
                <path class="slash" d="M4 20L20 4" />
              </svg>
            </button>
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
          </div>

          <div class="strength" id="strength" aria-hidden="true">
            <div>
              <div class="bars"><i></i><i></i><i></i><i></i></div>
              <div class="strength-text" id="strengthText">اكتب 8 حروف على الأقل، وخلّي فيها أرقام ورموز.</div>
            </div>
          </div>

          <button class="submit" id="submitBtn" type="submit">
            <span class="spinner" id="submitSpinner" aria-hidden="true"></span>
            <span id="submitLabel">دخول</span>
          </button>
        </form>

        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>
<script src="./supabase-config.js"></script>
  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);

    const els = {
      book: $("book"), form: $("authForm"),
      tabLogin: $("tabLogin"), tabSignup: $("tabSignup"), indicator: $("tabIndicator"),
      submitBtn: $("submitBtn"), submitLabel: $("submitLabel"),
      msg: $("msg"), email: $("email"), password: $("password"),
      emailWrap: $("emailWrap"), passwordWrap: $("passwordWrap"),
      togglePassword: $("togglePassword"), greeting: $("greeting"),
      strength: $("strength"), strengthText: $("strengthText"),
      bars: document.querySelectorAll(".bars i"),
    };

    let mode = "login";
    let busy = false;

    /* ===================== device binding ===================== */

    // Creates and persists a browser-specific device ID.
    // The server-side Edge Function will use this ID to bind
    // the account to its first authorized browser/device.
    function getDeviceId() {
      let deviceId = localStorage.getItem("axiom_device_id");

      if (!deviceId) {
        deviceId = crypto.randomUUID();
        localStorage.setItem("axiom_device_id", deviceId);
      }

      return deviceId;
    }

    function getDeviceName() {
      return `${navigator.platform} / ${navigator.language}`;
    }

    // Calls the check-device Edge Function to confirm this browser is the
    // account's authorized device. Throws (with a machine-readable
    // `.message`) when it isn't, so the caller can sign the session back out.
    async function checkDeviceAccess(accessToken) {
      const response = await fetch(
        "https://lxbqnzfmhzbyypohysbb.supabase.co/functions/v1/check-device",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${accessToken}`,
          },
          body: JSON.stringify({
            device_id: getDeviceId(),
            device_name: getDeviceName(),
          }),
        }
      );

      const result = await response.json();
      if (!response.ok || !result.allowed) {
        throw new Error(result.reason || "device_not_allowed");
      }
      return result;
    }

    /* ===================== ui helpers ===================== */

    function showMsg(text, kind = "") {
      els.msg.textContent = "";
      // force the entrance animation to replay even for an identical message
      void els.msg.offsetWidth;
      els.msg.className = "msg" + (kind ? " " + kind : "");
      els.msg.textContent = text;
    }

    function shake() {
      els.book.classList.remove("shake");
      void els.book.offsetWidth;
      els.book.classList.add("shake");
    }

    function markInvalid(wrap) {
      wrap.classList.add("invalid");
      wrap.querySelector("input").addEventListener(
        "input", () => wrap.classList.remove("invalid"), { once: true }
      );
    }

    function fail(text, wrap) {
      showMsg(text, "error");
      shake();
      if (wrap) { markInvalid(wrap); wrap.querySelector("input").focus(); }
    }

    function setMode(m) {
      if (busy) return;
      mode = m;
      const isLogin = m === "login";
      els.tabLogin.setAttribute("aria-selected", String(isLogin));
      els.tabSignup.setAttribute("aria-selected", String(!isLogin));
      els.indicator.dataset.mode = m;
      els.submitLabel.textContent = isLogin ? "دخول" : "إنشاء الحساب";
      // correct autocomplete hint matters: it stops password managers from
      // saving the wrong credential and lets them offer a generated password
      els.password.setAttribute("autocomplete", isLogin ? "current-password" : "new-password");
      els.strength.classList.toggle("show", !isLogin);
      els.strength.setAttribute("aria-hidden", String(isLogin));
      if (!isLogin) updateStrength();
      showMsg("");
      els.emailWrap.classList.remove("invalid");
      els.passwordWrap.classList.remove("invalid");
    }

    function setLoading(isLoading, loadingText) {
      busy = isLoading;
      els.submitBtn.disabled = isLoading;
      els.submitBtn.classList.toggle("loading", isLoading);
      els.submitBtn.setAttribute("aria-busy", String(isLoading));
      if (isLoading) {
        els.submitBtn.dataset.prevLabel = els.submitLabel.textContent;
        els.submitLabel.textContent = loadingText;
      } else if (els.submitBtn.dataset.prevLabel) {
        els.submitLabel.textContent = els.submitBtn.dataset.prevLabel;
      }
    }

    /* ===================== greeting ===================== */

    (function setGreeting() {
      const h = new Date().getHours();
      els.greeting.textContent =
        h < 5  ? "سهرانين لحد دلوقتي؟" :
        h < 12 ? "صباح الخير" :
        h < 17 ? "مساء الخير" :
        h < 21 ? "مساء الفل" : "مساء الخير";
    })();

    /* ===================== returning from password reset ===================== */

    (function checkResetSuccess() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("reset") === "success") {
        showMsg("تم تغيير كلمة المرور بنجاح. سجّل دخولك بكلمة المرور الجديدة.", "ok");
        // ننضّف الرابط عشان الرسالة متتكررش لو المستخدم عمل refresh
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    })();

    /* ===================== password ===================== */

    els.togglePassword.addEventListener("click", () => {
      const nowVisible = els.password.type === "password";
      els.password.type = nowVisible ? "text" : "password";
      els.togglePassword.setAttribute("aria-pressed", String(nowVisible));
      els.togglePassword.setAttribute("aria-label", nowVisible ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
      els.password.focus();
    });

    const STRENGTH = [
      { text: "ضعيفة جداً", color: "#ff6b6b" },
      { text: "ضعيفة",      color: "#ff9a5a" },
      { text: "متوسطة",     color: "#e8c07d" },
      { text: "قوية",       color: "#8fd9ac" },
    ];

    function scorePassword(v) {
      if (!v) return -1;
      let s = 0;
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      return Math.min(3, Math.max(0, s - 1));
    }

    function updateStrength() {
      const v = els.password.value;
      const score = scorePassword(v);
      els.bars.forEach((bar, i) => {
        bar.style.background = (score >= 0 && i <= score)
          ? STRENGTH[score].color
          : "rgba(232, 241, 245, 0.14)";
      });
      els.strengthText.textContent = score < 0
        ? "اكتب 8 حروف على الأقل، وخلّي فيها أرقام ورموز."
        : "قوة كلمة المرور: " + STRENGTH[score].text;
    }

    els.password.addEventListener("input", () => { if (mode === "signup") updateStrength(); });

    /* ===================== tabs ===================== */

    els.tabLogin.addEventListener("click", () => setMode("login"));
    els.tabSignup.addEventListener("click", () => setMode("signup"));

    // arrow-key navigation between tabs, as expected from a real tablist
    [els.tabLogin, els.tabSignup].forEach((tab) => {
      tab.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        const next = mode === "login" ? els.tabSignup : els.tabLogin;
        setMode(mode === "login" ? "signup" : "login");
        next.focus();
      });
    });

    /* ===================== validation ===================== */

    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function validate(email, password) {
      if (!email) return { ok: false, text: "اكتب الإيميل الأول", wrap: els.emailWrap };
      if (!EMAIL_RE.test(email)) return { ok: false, text: "الإيميل ده مش شكله صح", wrap: els.emailWrap };
      if (!password) return { ok: false, text: "اكتب كلمة المرور", wrap: els.passwordWrap };
      if (mode === "signup" && password.length < 8) {
        return { ok: false, text: "كلمة المرور لازم تكون 8 حروف على الأقل", wrap: els.passwordWrap };
      }
      return { ok: true };
    }

    /* ===================== auth ===================== */

    // مهم: التحقق ده كله في المتصفح. الحماية الحقيقية لازم تكون Row Level
    // Security على جدول subscriptions في Supabase، بحيث المستخدم يقدر يقرأ
    // صفّه هو بس، ومايقدرش يعمل update على active أو expires_at نهائياً.
    function isSubscriptionValid(sub) {
      if (!sub || !sub.active) return false;
      if (sub.expires_at && new Date(sub.expires_at).getTime() < Date.now()) return false;
      return true;
    }

    async function routeAfterLogin(session) {
      const email = session.user.email;

      if (axiomIsAdmin(session.user)) {
        showMsg("أهلاً بيك يا أدمن، بنحوّلك...", "ok");
        window.location.href = "./admin.html";
        return;
      }

      const { data: sub, error } = await supabaseClient
        .from("subscriptions")
        .select("active, expires_at")
        .eq("id", session.user.id)
        .maybeSingle();

      if (error) {
        showMsg("مش قادرين نتأكد من الاشتراك دلوقتي. جرّب تاني بعد شوية.", "error");
        await supabaseClient.auth.signOut();
        return;
      }

      if (isSubscriptionValid(sub)) {
        showMsg("تمام، بنفتحلك المحرّك...", "ok");
        window.location.href = "./index.html";
        return;
      }

      // النوع ده من الرسايل بيفرق: المستخدم يعرف هو منتهي ولا لسه متفعّلش
      const expired = sub && sub.active && sub.expires_at;
      showMsg(
        expired
          ? "اشتراكك انتهى. كلّم الأدمن عشان يجدّدهولك."
          : "حسابك لسه متفعّلش. استنى تفعيل الأدمن للاشتراك.",
        "wait"
      );
      await supabaseClient.auth.signOut();
    }

    function friendlyAuthError(error, forMode) {
      const m = (error && error.message ? error.message : "").toLowerCase();
      if (m.includes("invalid login")) return "الإيميل أو كلمة المرور غلط";
      if (m.includes("email not confirmed")) return "لازم تأكّد الإيميل بتاعك الأول من الرسالة اللي وصلتك";
      if (m.includes("already registered") || m.includes("already been registered")) {
        return "الإيميل ده متسجّل قبل كده. جرّب تسجّل دخول.";
      }
      if (m.includes("rate limit") || m.includes("too many")) return "محاولات كتير. استنى دقيقة وجرّب تاني.";
      if (m.includes("password")) return "كلمة المرور مش مطابقة للشروط";
      if (m.includes("fetch") || m.includes("network")) return "مفيش اتصال بالنت. اتأكد من الشبكة وجرّب تاني.";
      return forMode === "login" ? "مش قادرين نسجّل دخولك دلوقتي. جرّب تاني." : "حصل خطأ أثناء إنشاء الحساب. جرّب تاني.";
    }

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (busy) return;

      const email = els.email.value.trim();
      const password = els.password.value;
      showMsg("");

      const check = validate(email, password);
      if (!check.ok) { fail(check.text, check.wrap); return; }

      setLoading(true, mode === "login" ? "بيتم الدخول..." : "بيتم الإنشاء...");

      try {
        if (mode === "login") {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) { fail(friendlyAuthError(error, "login")); return; }

          try {
            await checkDeviceAccess(data.session.access_token);
          } catch (deviceError) {
            await supabaseClient.auth.signOut();
            fail(
              deviceError.message === "different_device"
                ? "هذا الحساب مرتبط بجهاز آخر"
                : "تعذر التحقق من الجهاز"
            );
            return;
          }

          await routeAfterLogin(data.session);
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) { fail(friendlyAuthError(error, "signup")); return; }

          // بنسيب insert الصف للـ trigger في القاعدة لو موجود؛ لو مش موجود
          // بنحاول نعمله هنا، وأي خطأ (زي إن الصف موجود أصلاً) بنتجاهله
          if (data.user) {
            const { error: insErr } = await supabaseClient
              .from("subscriptions")
              .insert({ id: data.user.id, email, active: false });
            if (insErr && !String(insErr.message).toLowerCase().includes("duplicate")) {
              console.warn("subscriptions insert:", insErr.message);
            }
          }

          els.form.reset();
          updateStrength();
          showMsg("تم إنشاء الحساب. استنى تفعيل الأدمن للاشتراك عشان تقدر تدخل.", "wait");
        }
      } catch (err) {
        console.error(err);
        fail("حصل خطأ غير متوقع. اتأكد من الاتصال بالنت وجرّب تاني.");
      } finally {
        setLoading(false);
      }
    });

    /* ===================== existing session ===================== */

    (async function checkExistingSession() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          setLoading(true, "بنراجع جلستك...");

          try {
            await checkDeviceAccess(session.access_token);
          } catch (deviceError) {
            await supabaseClient.auth.signOut();
            setLoading(false);
            fail(
              deviceError.message === "different_device"
                ? "هذا الحساب مرتبط بجهاز آخر"
                : "تعذر التحقق من الجهاز"
            );
            return;
          }

          await routeAfterLogin(session);
          setLoading(false);
        }
      } catch (err) {
        console.error(err);
        setLoading(false);
      }
    })();
  </script>
</body>

</html>
