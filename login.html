<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B262C" />
  <meta name="description" content="Axiom — تسجيل الدخول لمحرّك الحل الذكي" />
  <title>Axiom — تسجيل الدخول</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet">
  <link rel="preload" as="image" href="./assets/login-art.webp">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
    integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <style>
    :root {
      --void: #1B262C;
      --navy: #0F4C75;
      --navy-deep: #0B1A26;
      --sky: #3282B8;
      --parchment: #E8F1F5;
      --parchment-dim: rgba(232, 241, 245, 0.72);
      --gold: #D8A752;
      --gold-bright: #F0C77A;
      --gold-deep: #A8742A;
      --gold-dim: rgba(216, 167, 82, 0.55);
      --border: rgba(50, 130, 184, 0.45);
      --border-soft: rgba(50, 130, 184, 0.22);
      --error: #ff9a9a;
      --ok: #8fd9ac;
      --wait: #e8c07d;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --hex-tab: polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%);
      --hex-btn: polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: 'Tajawal', system-ui, sans-serif;
      color: var(--parchment);
      background:
        radial-gradient(ellipse 60% 55% at 12% 0%, rgba(50, 130, 184, 0.28), transparent 65%),
        radial-gradient(ellipse 55% 45% at 0% 100%, rgba(201, 112, 63, 0.14), transparent 60%),
        linear-gradient(180deg, #14202A 0%, var(--void) 55%, #101A21 100%);
      overflow-x: hidden;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    /* ===================== artwork (right side) ===================== */
    .art {
      position: fixed;
      top: 0; bottom: 0; right: 0;
      width: min(64vw, 1040px);
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent 60%, rgba(16, 26, 33, 0.75) 100%),
        linear-gradient(90deg, rgba(15, 76, 117, 0.42), rgba(15, 76, 117, 0.04) 70%),
        url("./assets/login-art.webp") 40% center / cover no-repeat;
      -webkit-mask-image: linear-gradient(to left, #000 52%, transparent 100%);
              mask-image: linear-gradient(to left, #000 52%, transparent 100%);
      animation: artIn 1.4s var(--ease) both;
    }

    @keyframes artIn {
      from { opacity: 0; transform: scale(1.03); }
      to   { opacity: 1; transform: none; }
    }

    /* ===================== stage ===================== */
    .stage {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      direction: ltr;
      padding: clamp(20px, 4vw, 48px) clamp(16px, 12vw, 200px);
    }

    /* ---- logo ---- */
    .logo {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.4vw, 18px);
      margin: 0 0 clamp(16px, 2.6vw, 30px) clamp(0px, 0.4vw, 6px);
      filter: drop-shadow(0 2px 16px rgba(216, 167, 82, 0.35));
    }

    .logo img {
      height: clamp(46px, 7.4vw, 92px);
      width: auto;
      flex-shrink: 0;
    }

    .logo h1 {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: clamp(42px, 7.4vw, 92px);
      line-height: 1;
      letter-spacing: 0.01em;
      background: linear-gradient(180deg, #FFEDB8 0%, var(--gold-bright) 38%, var(--gold) 66%, var(--gold-deep) 100%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
    }

    /* ===================== panel ===================== */
    .panel {
      position: relative;
      width: min(100%, 560px);
      padding: clamp(26px, 3.4vw, 40px) clamp(20px, 3.4vw, 44px) clamp(20px, 2.6vw, 28px);
      background:
        radial-gradient(ellipse 90% 40% at 50% 0%, rgba(50, 130, 184, 0.14), transparent 70%),
        linear-gradient(180deg, rgba(13, 40, 62, 0.93), rgba(17, 29, 37, 0.95));
      border: 1px solid rgba(216, 167, 82, 0.72);
      border-radius: 3px;
      box-shadow:
        inset 0 0 0 4px rgba(11, 26, 38, 0.6),
        inset 0 0 0 5px rgba(216, 167, 82, 0.16),
        0 30px 80px rgba(0, 0, 0, 0.55),
        0 0 46px rgba(50, 130, 184, 0.14);
      -webkit-backdrop-filter: blur(6px);
              backdrop-filter: blur(6px);
      animation: riseIn 0.7s var(--ease) both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .panel.shake { animation: shake 0.42s ease; }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }

    /* gold corner brackets */
    .corner {
      position: absolute;
      width: 26px; height: 26px;
      border: 0 solid var(--gold-bright);
      pointer-events: none;
    }
    .corner::after {
      content: '';
      position: absolute;
      width: 5px; height: 5px;
      background: var(--gold-bright);
      transform: rotate(45deg);
    }
    .corner.tl { top: -5px;    left: -5px;  border-top-width: 2px;    border-left-width: 2px; }
    .corner.tr { top: -5px;    right: -5px; border-top-width: 2px;    border-right-width: 2px; }
    .corner.bl { bottom: -5px; left: -5px;  border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: -5px; right: -5px; border-bottom-width: 2px; border-right-width: 2px; }
    .corner.tl::after { top: -3px;    left: -3px; }
    .corner.tr::after { top: -3px;    right: -3px; }
    .corner.bl::after { bottom: -3px; left: -3px; }
    .corner.br::after { bottom: -3px; right: -3px; }

    /* sapphire gems on the frame, top and bottom center */
    .gem {
      position: absolute;
      left: 50%;
      width: 0; height: 0;
      pointer-events: none;
    }
    .gem.top { top: 0; }
    .gem.bottom { bottom: 0; }
    .gem::before, .gem::after {
      content: '';
      position: absolute;
      top: -1px;
      width: 64px; height: 3px;
    }
    .gem::before { right: 14px; background: linear-gradient(270deg, var(--gold-bright), transparent); }
    .gem::after  { left: 14px;  background: linear-gradient(90deg,  var(--gold-bright), transparent); }
    .gem i {
      position: absolute;
      left: -11px; top: -11px;
      width: 22px; height: 22px;
      transform: rotate(45deg);
      border: 2px solid var(--gold-bright);
      background: linear-gradient(135deg, #8FD0F7 0%, var(--sky) 50%, var(--navy) 100%);
      box-shadow: 0 0 14px rgba(50, 130, 184, 0.75), inset 0 0 4px rgba(255, 255, 255, 0.5);
    }

    /* ===================== tabs ===================== */
    .tabs {
      direction: ltr;
      display: flex;
      margin: 0 0 24px;
    }

    .tabs button {
      position: relative;
      isolation: isolate;
      flex: 1;
      height: 48px;
      padding: 0 18px;
      border: 0;
      background: transparent;
      color: var(--parchment-dim);
      font-family: inherit;
      font-size: 16.5px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.25s var(--ease), filter 0.25s var(--ease);
    }
    .tabs button + button { margin-left: -6px; }

    .tabs button::before,
    .tabs button::after {
      content: '';
      position: absolute;
      clip-path: var(--hex-tab);
      transition: background 0.25s var(--ease);
    }
    .tabs button::before { inset: 0;   z-index: -2; background: var(--border); }
    .tabs button::after  { inset: 1px; z-index: -1; background: linear-gradient(180deg, rgba(15, 76, 117, 0.28), rgba(11, 26, 38, 0.8)); }

    .tabs button:hover { color: var(--parchment); }

    .tabs button[aria-selected="true"] {
      color: var(--gold-bright);
      filter: drop-shadow(0 4px 12px rgba(216, 167, 82, 0.28));
      z-index: 1;
    }
    .tabs button[aria-selected="true"]::before { background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep)); }
    .tabs button[aria-selected="true"]::after  { background: linear-gradient(180deg, rgba(216, 167, 82, 0.34), rgba(17, 29, 37, 0.96) 85%); }

    .tabs button:focus-visible { outline: none; }
    .tabs button:focus-visible::before { background: #fff; }

    /* ===================== fields ===================== */
    .fields { display: flex; flex-direction: column; }

    .field {
      direction: ltr;
      position: relative;
      display: flex;
      align-items: center;
      height: 58px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(8, 20, 30, 0.6);
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease), background-color 0.25s var(--ease);
    }

    .field:hover { border-color: rgba(50, 130, 184, 0.7); }

    .field:focus-within {
      border-color: var(--gold);
      background: rgba(8, 20, 30, 0.8);
      box-shadow: 0 0 0 3px rgba(216, 167, 82, 0.16), inset 0 0 16px rgba(216, 167, 82, 0.05);
    }

    .field.invalid { border-color: var(--error); box-shadow: 0 0 0 3px rgba(255, 154, 154, 0.14); }

    .field .icon {
      flex-shrink: 0;
      width: 24px; height: 24px;
      margin-left: 16px;
      fill: none;
      stroke: rgba(232, 241, 245, 0.72);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.25s var(--ease);
    }
    .field:focus-within .icon { stroke: var(--gold-bright); }

    .field input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 14px;
      border: 0;
      background: transparent;
      color: var(--parchment);
      font-family: inherit;
      font-size: 16.5px;
      text-align: left;
    }
    .field input::placeholder { color: rgba(232, 241, 245, 0.5); }
    .field input:focus { outline: none; }

    /* keep browser autofill from painting a white box */
    .field input:-webkit-autofill {
      -webkit-text-fill-color: var(--parchment);
      transition: background-color 9999s ease-out 0s;
      box-shadow: 0 0 0 40px #0c2030 inset;
    }

    .toggle-eye {
      flex-shrink: 0;
      margin-right: 10px;
      padding: 8px;
      line-height: 0;
      background: transparent;
      border: 0;
      border-radius: 8px;
      color: var(--parchment);
      opacity: 0.65;
      cursor: pointer;
      transition: opacity 0.2s ease, color 0.2s ease;
    }
    .toggle-eye:hover { opacity: 1; color: var(--gold-bright); }
    .toggle-eye svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .toggle-eye .slash { stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset 0.25s var(--ease); }
    .toggle-eye[aria-pressed="true"] .slash { stroke-dashoffset: 0; }

    /* ---- password strength (signup only) ---- */
    .strength {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-top: -6px;
      transition: grid-template-rows 0.35s var(--ease), opacity 0.25s ease, margin 0.35s var(--ease);
    }
    .strength.show { grid-template-rows: 1fr; opacity: 1; margin-bottom: 4px; }
    .strength > div { overflow: hidden; }

    .bars { display: flex; gap: 5px; padding-top: 4px; }
    .bars i {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(232, 241, 245, 0.14);
      transition: background-color 0.3s var(--ease);
    }
    .strength-text { font-size: 12.5px; margin: 6px 0 8px; color: var(--parchment-dim); }

    /* ===================== submit ===================== */
    .submit-wrap {
      margin-top: 10px;
      filter: drop-shadow(0 8px 18px rgba(216, 167, 82, 0.26));
      transition: filter 0.25s ease, transform 0.12s ease;
    }
    .submit-wrap:hover { filter: drop-shadow(0 10px 24px rgba(240, 199, 122, 0.4)); }
    .submit-wrap:active { transform: scale(0.99); }
    .submit-wrap:focus-within { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 8px 18px rgba(216, 167, 82, 0.3)); }

    button.submit {
      position: relative;
      width: 100%;
      height: 58px;
      border: 0;
      clip-path: var(--hex-btn);
      background: linear-gradient(180deg, #FBE1A0 0%, #E5B660 46%, #B98230 100%);
      color: #2A1A05;
      font-family: inherit;
      font-weight: 800;
      font-size: 19px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button.submit:focus-visible { outline: none; }

    /* inner highlight bevel */
    button.submit::after {
      content: '';
      position: absolute;
      inset: 3px;
      clip-path: var(--hex-btn);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0) 55%);
      pointer-events: none;
    }

    button.submit > span { position: relative; z-index: 1; }

    button.submit:disabled { opacity: 0.72; cursor: not-allowed; }

    /* sheen sweep while loading */
    button.submit.loading::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      animation: sheen 1.15s linear infinite;
    }
    @keyframes sheen {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    .spinner {
      display: none;
      width: 17px; height: 17px;
      border: 2px solid rgba(42, 26, 5, 0.3);
      border-top-color: #2A1A05;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    button.submit.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- message ---- */
    .msg {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
      line-height: 1.6;
    }
    .msg:not(:empty) { animation: msgIn 0.35s var(--ease) both; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }
    .msg.error { color: var(--error); }
    .msg.ok    { color: var(--ok); }
    .msg.wait  { color: var(--wait); }

    /* ---- switch login / signup ---- */
    .switch {
      margin: 12px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--border-soft);
      text-align: center;
      font-size: 14.5px;
      color: var(--parchment-dim);
    }

    .link {
      background: none;
      border: 0;
      padding: 2px 4px;
      color: var(--gold-bright);
      font-family: inherit;
      font-size: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .link:hover { color: #fff; }

    :where(.link, .toggle-eye):focus-visible {
      outline: 2px solid var(--gold-bright);
      outline-offset: 2px;
      border-radius: 6px;
    }

    /* ===================== responsive ===================== */
    @media (max-width: 960px) {
      .stage { align-items: center; padding: 24px 16px 32px; }
      .logo { margin-left: 0; }
      .art {
        width: 100%;
        background-position: 62% top;
        opacity: 0.55;
        -webkit-mask-image: linear-gradient(to bottom, #000 25%, transparent 90%);
                mask-image: linear-gradient(to bottom, #000 25%, transparent 90%);
      }
    }

    @media (max-width: 420px) {
      .tabs button { font-size: 15px; padding: 0 10px; }
      .field { height: 54px; }
      button.submit { height: 54px; font-size: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="art" aria-hidden="true"></div>

  <main class="stage">
    <div class="logo">
      <img src="./dragon-icon-gold.png" alt="" aria-hidden="true" onerror="this.remove()">
      <h1>AXIOM</h1>
    </div>

    <section class="panel" id="book" dir="rtl">
      <span class="corner tl" aria-hidden="true"></span>
      <span class="corner tr" aria-hidden="true"></span>
      <span class="corner bl" aria-hidden="true"></span>
      <span class="corner br" aria-hidden="true"></span>
      <span class="gem top" aria-hidden="true"><i></i></span>
      <span class="gem bottom" aria-hidden="true"><i></i></span>

      <div class="tabs" role="tablist" aria-label="نوع العملية">
        <button id="tabLogin" role="tab" aria-selected="true" aria-controls="authForm" type="button">تسجيل الدخول</button>
        <button id="tabSignup" role="tab" aria-selected="false" aria-controls="authForm" type="button">إنشاء حساب</button>
      </div>

      <form class="fields" id="authForm" novalidate>
        <label class="sr-only" for="email">الإيميل</label>
        <div class="field" id="emailWrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
            <path d="M3 7l9 6.5L21 7" />
          </svg>
          <input id="email" name="email" type="email" placeholder="الإيميل"
                 autocomplete="email" inputmode="email" required />
        </div>

        <label class="sr-only" for="password">كلمة المرور</label>
        <div class="field" id="passwordWrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4.5" y="10.5" width="15" height="10" rx="2.5" />
            <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
            <circle cx="12" cy="15.5" r="1.1" />
          </svg>
          <input id="password" name="password" type="password" placeholder="كلمة المرور"
                 autocomplete="current-password" required minlength="6" />
          <button type="button" class="toggle-eye" id="togglePassword"
                  aria-pressed="false" aria-label="إظهار كلمة المرور" aria-controls="password">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
              <path class="slash" d="M4 20L20 4" />
            </svg>
          </button>
        </div>

        <div class="strength" id="strength" aria-hidden="true">
          <div>
            <div class="bars">
              <i></i><i></i><i></i><i></i>
            </div>
            <div class="strength-text" id="strengthText">اكتب 8 حروف على الأقل، وخلّي فيها أرقام ورموز.</div>
          </div>
        </div>

        <div class="submit-wrap">
          <button class="submit" id="submitBtn" type="submit">
            <span class="spinner" id="submitSpinner" aria-hidden="true"></span>
            <span id="submitLabel">دخول</span>
          </button>
        </div>
      </form>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <p class="switch">
        <span id="switchText">ما عندكش حساب؟</span>
        <button type="button" class="link" id="switchBtn">إنشاء حساب</button>
      </p>
    </section>
  </main>

  <script src="./supabase-config.js"></script>
  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);

    const els = {
      book: $("book"), form: $("authForm"),
      tabLogin: $("tabLogin"), tabSignup: $("tabSignup"),
      switchText: $("switchText"), switchBtn: $("switchBtn"),
      submitBtn: $("submitBtn"), submitLabel: $("submitLabel"),
      msg: $("msg"), email: $("email"), password: $("password"),
      emailWrap: $("emailWrap"), passwordWrap: $("passwordWrap"),
      togglePassword: $("togglePassword"),
      strength: $("strength"), strengthText: $("strengthText"),
      bars: document.querySelectorAll(".bars i"),
    };

    let mode = "login";
    let busy = false;

    /* ===================== device binding ===================== */

    // Creates and persists a browser-specific device ID.
    // The server-side Edge Function will use this ID to bind
    // the account to its first authorized browser/device.
    function getDeviceId() {
      let deviceId = localStorage.getItem("axiom_device_id");

      if (!deviceId) {
        deviceId = crypto.randomUUID();
        localStorage.setItem("axiom_device_id", deviceId);
      }

      return deviceId;
    }

    function getDeviceName() {
      return `${navigator.platform} / ${navigator.language}`;
    }

    // Calls the check-device Edge Function to confirm this browser is the
    // account's authorized device. Throws (with a machine-readable
    // `.message`) when it isn't, so the caller can sign the session back out.
    async function checkDeviceAccess(accessToken) {
      const response = await fetch(
        "https://lxbqnzfmhzbyypohysbb.supabase.co/functions/v1/check-device",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${accessToken}`,
          },
          body: JSON.stringify({
            device_id: getDeviceId(),
            device_name: getDeviceName(),
          }),
        }
      );

      const result = await response.json();
      if (!response.ok || !result.allowed) {
        throw new Error(result.reason || "device_not_allowed");
      }
      return result;
    }

    /* ===================== ui helpers ===================== */

    function showMsg(text, kind = "") {
      els.msg.textContent = "";
      // force the entrance animation to replay even for an identical message
      void els.msg.offsetWidth;
      els.msg.className = "msg" + (kind ? " " + kind : "");
      els.msg.textContent = text;
    }

    function shake() {
      els.book.classList.remove("shake");
      void els.book.offsetWidth;
      els.book.classList.add("shake");
    }

    function markInvalid(wrap) {
      wrap.classList.add("invalid");
      wrap.querySelector("input").addEventListener(
        "input", () => wrap.classList.remove("invalid"), { once: true }
      );
    }

    function fail(text, wrap) {
      showMsg(text, "error");
      shake();
      if (wrap) { markInvalid(wrap); wrap.querySelector("input").focus(); }
    }

    function setMode(m) {
      if (busy) return;
      mode = m;
      const isLogin = m === "login";
      els.tabLogin.setAttribute("aria-selected", String(isLogin));
      els.tabSignup.setAttribute("aria-selected", String(!isLogin));
      els.switchText.textContent = isLogin ? "ما عندكش حساب؟" : "عندك حساب؟";
      els.switchBtn.textContent = isLogin ? "إنشاء حساب" : "تسجيل الدخول";
      els.submitLabel.textContent = isLogin ? "دخول" : "إنشاء الحساب";
      // correct autocomplete hint matters: it stops password managers from
      // saving the wrong credential and lets them offer a generated password
      els.password.setAttribute("autocomplete", isLogin ? "current-password" : "new-password");
      els.strength.classList.toggle("show", !isLogin);
      els.strength.setAttribute("aria-hidden", String(isLogin));
      if (!isLogin) updateStrength();
      showMsg("");
      els.emailWrap.classList.remove("invalid");
      els.passwordWrap.classList.remove("invalid");
    }

    function setLoading(isLoading, loadingText) {
      busy = isLoading;
      els.submitBtn.disabled = isLoading;
      els.submitBtn.classList.toggle("loading", isLoading);
      els.submitBtn.setAttribute("aria-busy", String(isLoading));
      if (isLoading) {
        els.submitBtn.dataset.prevLabel = els.submitLabel.textContent;
        els.submitLabel.textContent = loadingText;
      } else if (els.submitBtn.dataset.prevLabel) {
        els.submitLabel.textContent = els.submitBtn.dataset.prevLabel;
      }
    }

    /* ===================== returning from password reset ===================== */

    (function checkResetSuccess() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("reset") === "success") {
        showMsg("تم تغيير كلمة المرور بنجاح. سجّل دخولك بكلمة المرور الجديدة.", "ok");
        // ننضّف الرابط عشان الرسالة متتكررش لو المستخدم عمل refresh
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    })();

    /* ===================== password ===================== */

    els.togglePassword.addEventListener("click", () => {
      const nowVisible = els.password.type === "password";
      els.password.type = nowVisible ? "text" : "password";
      els.togglePassword.setAttribute("aria-pressed", String(nowVisible));
      els.togglePassword.setAttribute("aria-label", nowVisible ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
      els.password.focus();
    });

    const STRENGTH = [
      { text: "ضعيفة جداً", color: "#ff6b6b" },
      { text: "ضعيفة",      color: "#ff9a5a" },
      { text: "متوسطة",     color: "#e8c07d" },
      { text: "قوية",       color: "#8fd9ac" },
    ];

    function scorePassword(v) {
      if (!v) return -1;
      let s = 0;
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      return Math.min(3, Math.max(0, s - 1));
    }

    function updateStrength() {
      const v = els.password.value;
      const score = scorePassword(v);
      els.bars.forEach((bar, i) => {
        bar.style.background = (score >= 0 && i <= score)
          ? STRENGTH[score].color
          : "rgba(232, 241, 245, 0.14)";
      });
      els.strengthText.textContent = score < 0
        ? "اكتب 8 حروف على الأقل، وخلّي فيها أرقام ورموز."
        : "قوة كلمة المرور: " + STRENGTH[score].text;
    }

    els.password.addEventListener("input", () => { if (mode === "signup") updateStrength(); });

    /* ===================== tabs ===================== */

    els.tabLogin.addEventListener("click", () => setMode("login"));
    els.tabSignup.addEventListener("click", () => setMode("signup"));
    els.switchBtn.addEventListener("click", () => setMode(mode === "login" ? "signup" : "login"));

    // arrow-key navigation between tabs, as expected from a real tablist
    [els.tabLogin, els.tabSignup].forEach((tab) => {
      tab.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        const next = mode === "login" ? els.tabSignup : els.tabLogin;
        setMode(mode === "login" ? "signup" : "login");
        next.focus();
      });
    });

    /* ===================== validation ===================== */

    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function validate(email, password) {
      if (!email) return { ok: false, text: "اكتب الإيميل الأول", wrap: els.emailWrap };
      if (!EMAIL_RE.test(email)) return { ok: false, text: "الإيميل ده مش شكله صح", wrap: els.emailWrap };
      if (!password) return { ok: false, text: "اكتب كلمة المرور", wrap: els.passwordWrap };
      if (mode === "signup" && password.length < 8) {
        return { ok: false, text: "كلمة المرور لازم تكون 8 حروف على الأقل", wrap: els.passwordWrap };
      }
      return { ok: true };
    }

    /* ===================== auth ===================== */

    // مهم: التحقق ده كله في المتصفح. الحماية الحقيقية لازم تكون Row Level
    // Security على جدول subscriptions في Supabase، بحيث المستخدم يقدر يقرأ
    // صفّه هو بس، ومايقدرش يعمل update على active أو expires_at نهائياً.
    function isSubscriptionValid(sub) {
      if (!sub || !sub.active) return false;
      if (sub.expires_at && new Date(sub.expires_at).getTime() < Date.now()) return false;
      return true;
    }

    async function routeAfterLogin(session) {
      const email = session.user.email;

      if (axiomIsAdmin(session.user)) {
        showMsg("أهلاً بيك يا أدمن، بنحوّلك...", "ok");
        window.location.href = "./admin.html";
        return;
      }

      const { data: sub, error } = await supabaseClient
        .from("subscriptions")
        .select("active, expires_at")
        .eq("id", session.user.id)
        .maybeSingle();

      if (error) {
        showMsg("مش قادرين نتأكد من الاشتراك دلوقتي. جرّب تاني بعد شوية.", "error");
        await supabaseClient.auth.signOut();
        return;
      }

      if (isSubscriptionValid(sub)) {
        showMsg("تمام، بنفتحلك المحرّك...", "ok");
        window.location.href = "./index.html";
        return;
      }

      // النوع ده من الرسايل بيفرق: المستخدم يعرف هو منتهي ولا لسه متفعّلش
      const expired = sub && sub.active && sub.expires_at;
      showMsg(
        expired
          ? "اشتراكك انتهى. كلّم الأدمن عشان يجدّدهولك."
          : "حسابك لسه متفعّلش. استنى تفعيل الأدمن للاشتراك.",
        "wait"
      );
      await supabaseClient.auth.signOut();
    }

    function friendlyAuthError(error, forMode) {
      const m = (error && error.message ? error.message : "").toLowerCase();
      if (m.includes("invalid login")) return "الإيميل أو كلمة المرور غلط";
      if (m.includes("email not confirmed")) return "لازم تأكّد الإيميل بتاعك الأول من الرسالة اللي وصلتك";
      if (m.includes("already registered") || m.includes("already been registered")) {
        return "الإيميل ده متسجّل قبل كده. جرّب تسجّل دخول.";
      }
      if (m.includes("rate limit") || m.includes("too many")) return "محاولات كتير. استنى دقيقة وجرّب تاني.";
      if (m.includes("password")) return "كلمة المرور مش مطابقة للشروط";
      if (m.includes("fetch") || m.includes("network")) return "مفيش اتصال بالنت. اتأكد من الشبكة وجرّب تاني.";
      return forMode === "login" ? "مش قادرين نسجّل دخولك دلوقتي. جرّب تاني." : "حصل خطأ أثناء إنشاء الحساب. جرّب تاني.";
    }

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (busy) return;

      const email = els.email.value.trim();
      const password = els.password.value;
      showMsg("");

      const check = validate(email, password);
      if (!check.ok) { fail(check.text, check.wrap); return; }

      setLoading(true, mode === "login" ? "بيتم الدخول..." : "بيتم الإنشاء...");

      try {
        if (mode === "login") {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) { fail(friendlyAuthError(error, "login")); return; }

          try {
            await checkDeviceAccess(data.session.access_token);
          } catch (deviceError) {
            await supabaseClient.auth.signOut();
            fail(
              deviceError.message === "different_device"
                ? "هذا الحساب مرتبط بجهاز آخر"
                : "تعذر التحقق من الجهاز"
            );
            return;
          }

          await routeAfterLogin(data.session);
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) { fail(friendlyAuthError(error, "signup")); return; }

          // بنسيب insert الصف للـ trigger في القاعدة لو موجود؛ لو مش موجود
          // بنحاول نعمله هنا، وأي خطأ (زي إن الصف موجود أصلاً) بنتجاهله
          if (data.user) {
            const { error: insErr } = await supabaseClient
              .from("subscriptions")
              .insert({ id: data.user.id, email, active: false });
            if (insErr && !String(insErr.message).toLowerCase().includes("duplicate")) {
              console.warn("subscriptions insert:", insErr.message);
            }
          }

          els.form.reset();
          updateStrength();
          showMsg("تم إنشاء الحساب. استنى تفعيل الأدمن للاشتراك عشان تقدر تدخل.", "wait");
        }
      } catch (err) {
        console.error(err);
        fail("حصل خطأ غير متوقع. اتأكد من الاتصال بالنت وجرّب تاني.");
      } finally {
        setLoading(false);
      }
    });

    /* ===================== existing session ===================== */

    (async function checkExistingSession() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          setLoading(true, "بنراجع جلستك...");

          try {
            await checkDeviceAccess(session.access_token);
          } catch (deviceError) {
            await supabaseClient.auth.signOut();
            setLoading(false);
            fail(
              deviceError.message === "different_device"
                ? "هذا الحساب مرتبط بجهاز آخر"
                : "تعذر التحقق من الجهاز"
            );
            return;
          }

          await routeAfterLogin(session);
          setLoading(false);
        }
      } catch (err) {
        console.error(err);
        setLoading(false);
      }
    })();
  </script>
</body>

</html>
