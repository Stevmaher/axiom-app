<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030C14" />
  <meta name="description" content="Axiom — تسجيل الدخول لمحرّك الحل الذكي" />
  <title>Axiom — تسجيل الدخول</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./favicon-180.png">
  <link rel="preload" as="image" href="./login-bg.webp" media="(min-width: 901px)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
    integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <style>
    :root {
      --void: #030C14;
      --navy: #061826;
      --navy-2: #04111C;
      --field: rgba(1, 17, 29, 0.88);
      --parchment: #E9EEF3;
      --muted: #8A97A6;
      --line: rgba(150, 170, 192, 0.42);
      --gold-hi: #FBE08A;
      --gold: #E8A92E;
      --gold-lo: #B8710F;
      --gold-text: #F6D98A;
      --gold-dim: rgba(232, 169, 46, 0.5);
      --gem: #2C9BE6;
      --ember: #E8561F;
      --error: #FF8F8F;
      --ok: #8FD9AC;
      --wait: #F0C36B;
      --hex: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%);
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      font-family: 'Tajawal', system-ui, sans-serif;
      color: var(--parchment);
      background: var(--void);
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ===================== backdrop ===================== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: var(--void) url('./login-bg.webp') 78% center / cover no-repeat;
    }

    /* keeps the left half calm so the card reads; the warrior stays untouched on the right */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2, 10, 18, 0.86) 0%, rgba(2, 10, 18, 0.55) 40%, rgba(2, 10, 18, 0) 66%),
        linear-gradient(180deg, rgba(2, 10, 18, 0.3), transparent 22%, transparent 78%, rgba(2, 10, 18, 0.5));
    }

    /* ===================== stage ===================== */
    /* The artwork is composed left-to-right in the reference, so this row is
       laid out physically (ltr) and only the card's contents are rtl. */
    .stage {
      direction: ltr;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(16px, 3vw, 40px) clamp(16px, 6vw, 110px);
    }

    .auth-col {
      width: min(100%, 520px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.6vw, 18px);
    }

    /* ===================== wordmark ===================== */
    .brand-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.4vw, 16px);
      margin: 0;
      direction: ltr;
    }

    .brand-mark {
      width: clamp(52px, 6.4vw, 100px);
      height: auto;
      flex-shrink: 0;
      filter: drop-shadow(0 0 14px rgba(255, 176, 48, 0.55));
    }

    .brand {
      margin: 0;
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: clamp(46px, 6.4vw, 100px);
      line-height: 1;
      letter-spacing: 0.01em;
      background: linear-gradient(180deg, #FFF3B8 0%, #F7CC57 34%, #D8941E 60%, #F4C44E 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 0 rgba(90, 44, 0, 0.55)) drop-shadow(0 0 22px rgba(255, 160, 30, 0.38));
    }

    .brand-logo-wrap { line-height: 0; background: none; filter: none; }

    .brand-logo {
      display: block;
      width: clamp(190px, 30vw, 380px);
      height: auto;
      filter: drop-shadow(0 0 22px rgba(255, 160, 30, 0.4));
    }

    /* ===================== card ===================== */
    .book {
      position: relative;
      direction: rtl;
      width: 100%;
      padding: clamp(26px, 3.2vw, 38px) clamp(22px, 3.4vw, 46px) clamp(22px, 2.6vw, 30px);
      background:
        radial-gradient(ellipse 80% 40% at 50% 0%, rgba(44, 155, 230, 0.08), transparent 70%),
        linear-gradient(180deg, rgba(5, 22, 36, 0.9), rgba(2, 11, 19, 0.94));
      border: 1px solid rgba(232, 169, 46, 0.55);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        inset 0 0 0 1px rgba(232, 169, 46, 0.08),
        inset 0 0 60px rgba(0, 0, 0, 0.35);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      animation: cardIn 0.7s var(--ease) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    .book.shake { animation: shake 0.42s ease; }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }

    /* gold corner brackets */
    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      pointer-events: none;
      border: 0 solid var(--gold);
      filter: drop-shadow(0 0 6px rgba(232, 169, 46, 0.5));
    }
    .corner::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      background: var(--gold-hi);
      transform: rotate(45deg);
    }
    .corner.tl { top: -2px; left: -2px; border-top-width: 3px; border-left-width: 3px; }
    .corner.tr { top: -2px; right: -2px; border-top-width: 3px; border-right-width: 3px; }
    .corner.bl { bottom: -2px; left: -2px; border-bottom-width: 3px; border-left-width: 3px; }
    .corner.br { bottom: -2px; right: -2px; border-bottom-width: 3px; border-right-width: 3px; }
    .corner.tl::after { top: -4px; left: -4px; }
    .corner.tr::after { top: -4px; right: -4px; }
    .corner.bl::after { bottom: -4px; left: -4px; }
    .corner.br::after { bottom: -4px; right: -4px; }

    /* blue gem set into the top and bottom edge, with gold wings */
    .gem-wrap {
      position: absolute;
      inset-inline: 0;
      height: 0;
      pointer-events: none;
    }
    .gem-wrap.top { top: 0; }
    .gem-wrap.bottom { bottom: 0; }

    .gem-wrap::before, .gem-wrap::after {
      content: '';
      position: absolute;
      top: -1px;
      width: 15%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .gem-wrap::before { left: calc(50% - 15% - 18px); }
    .gem-wrap::after { right: calc(50% - 15% - 18px); transform: scaleX(-1); }

    .gem {
      position: absolute;
      left: 50%;
      top: -11px;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      transform: rotate(45deg);
      background: radial-gradient(circle at 35% 30%, #9FDBFF 0%, var(--gem) 45%, #0B4F86 100%);
      border: 2px solid var(--gold);
      box-shadow: 0 0 14px rgba(44, 155, 230, 0.75), 0 0 0 4px rgba(3, 12, 20, 0.9);
    }

    /* ===================== tabs ===================== */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: clamp(16px, 2vw, 22px);
      filter: drop-shadow(0 0 10px rgba(232, 169, 46, 0.18));
    }

    .tabs button {
      position: relative;
      flex: 1;
      height: 54px;
      padding: 0 10px;
      border: 0;
      background: rgba(60, 120, 170, 0.5);
      clip-path: var(--hex);
      color: var(--muted);
      font-family: inherit;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.25s var(--ease);
    }

    .tabs button:first-child { margin-inline-end: -10px; }

    .tabs button::before {
      content: '';
      position: absolute;
      inset: 1px;
      clip-path: var(--hex);
      background: linear-gradient(180deg, #08233A, #051523);
      transition: background 0.3s var(--ease);
    }

    .tabs button span { position: relative; }

    .tabs button:hover { color: var(--parchment); }

    .tabs button[aria-selected="true"] {
      color: var(--gold-text);
      font-weight: 800;
      background: linear-gradient(180deg, var(--gold-hi), var(--gold-lo));
      z-index: 1;
    }

    .tabs button[aria-selected="true"]::before {
      background: linear-gradient(180deg, #3B2A0B 0%, #1C1608 100%);
    }

    /* ===================== fields ===================== */
    .fields { display: flex; flex-direction: column; gap: 16px; }

    .field-wrap {
      position: relative;
      height: 60px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--field);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field-wrap:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(232, 169, 46, 0.18);
    }

    .field-wrap.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(255, 143, 143, 0.14);
    }

    .field-wrap .icon {
      position: absolute;
      inset-inline-start: 18px;
      top: 50%;
      width: 26px;
      height: 26px;
      transform: translateY(-50%);
      fill: none;
      stroke: #AEB9C6;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 100%;
      padding: 0 62px 0 14px;
      border: 0;
      background: transparent;
      color: var(--parchment);
      font-size: 17px;
      font-family: inherit;
      text-align: start;
    }

    .field-wrap input { padding-inline-start: 58px; padding-inline-end: 16px; }
    .field-wrap.has-eye input { padding-inline-end: 54px; }

    input::placeholder { color: #8795A4; opacity: 1; }
    input:focus, input:focus-visible { outline: none; }
    input[type="email"] { direction: ltr; text-align: right; padding: 0 58px 0 16px; }
    input[type="email"]::placeholder { direction: rtl; }

    .toggle-eye {
      position: absolute;
      inset-inline-end: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 8px;
      line-height: 0;
      color: #AEB9C6;
      border-radius: 8px;
      transition: color 0.2s ease;
    }
    .toggle-eye:hover { color: var(--parchment); }
    .toggle-eye svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .toggle-eye .slash { stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset 0.25s var(--ease); }
    .toggle-eye[aria-pressed="true"] .slash { stroke-dashoffset: 0; }

    /* ---- password strength (sign-up only) ---- */
    .strength {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-top: -16px;
      transition: grid-template-rows 0.35s var(--ease), opacity 0.25s ease, margin 0.35s var(--ease);
    }
    .strength.show { grid-template-rows: 1fr; opacity: 1; margin-top: -4px; }
    .strength > div { overflow: hidden; }

    .bars { display: flex; gap: 5px; }
    .bars i {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(233, 238, 243, 0.14);
      transition: background-color 0.3s var(--ease);
    }
    .strength-text { font-size: 12.5px; margin-top: 6px; color: var(--muted); }

    /* ===================== submit ===================== */
    .submit-wrap {
      margin-top: 6px;
      filter: drop-shadow(0 6px 16px rgba(232, 169, 46, 0.32));
    }

    button.submit {
      position: relative;
      width: 100%;
      height: 60px;
      border: 0;
      clip-path: var(--hex);
      background: linear-gradient(180deg, #FFF0B0, #A8650E);
      color: #2A1805;
      font-family: inherit;
      font-weight: 800;
      font-size: 22px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: filter 0.2s ease, transform 0.12s ease;
    }

    button.submit::before {
      content: '';
      position: absolute;
      inset: 2px;
      clip-path: var(--hex);
      background: linear-gradient(180deg, #F9D878 0%, #EDB23A 46%, #D18C1C 100%);
    }

    button.submit > * { position: relative; }

    button.submit:hover:not(:disabled) { filter: brightness(1.08); }
    button.submit:active:not(:disabled) { transform: scale(0.99); }
    button.submit:disabled { opacity: 0.75; cursor: not-allowed; }

    button.submit.loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: sheen 1.15s linear infinite;
    }
    @keyframes sheen {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    .spinner {
      display: none;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(42, 24, 5, 0.3);
      border-top-color: #2A1805;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    button.submit.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===================== footer + message ===================== */
    .switch {
      margin: 20px 0 0;
      text-align: center;
      font-size: 14.5px;
      color: var(--muted);
    }

    .link {
      background: none;
      border: 0;
      padding: 0 4px;
      color: var(--gold);
      font-family: inherit;
      font-size: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .link:hover { color: var(--gold-hi); text-decoration: underline; text-underline-offset: 4px; }

    :where(button, input, a):focus-visible {
      outline: 2px solid var(--gold-hi);
      outline-offset: 3px;
    }

    .msg {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      min-height: 22px;
      line-height: 1.6;
    }
    .msg:not(:empty) { animation: msgIn 0.35s var(--ease) both; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }
    .msg.error { color: var(--error); }
    .msg.ok    { color: var(--ok); }
    .msg.wait  { color: var(--wait); }

    /* ===================== responsive ===================== */
    @media (max-width: 900px) {
      /* artwork becomes a hero at the top; the card slides up over its lower edge */
      .bg {
        position: absolute;
        inset: 0 0 auto 0;
        height: clamp(380px, 62svh, 640px);
        background-image: url('./login-bg-sm.webp');
        background-position: 74% 8%;
      }
      .bg::after {
        background:
          linear-gradient(180deg, rgba(2, 10, 18, 0.35) 0%, rgba(2, 10, 18, 0) 18%, rgba(2, 10, 18, 0) 48%, rgba(3, 12, 20, 0.88) 82%, var(--void) 100%);
      }
      .stage {
        justify-content: center;
        align-items: flex-start;
        padding-top: clamp(150px, 28svh, 300px);
      }
      .brand-lockup { filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.75)); }
      .book { background-color: rgba(3, 12, 20, 0.92); }
    }

    @media (max-width: 480px) {
      .tabs button { height: 48px; font-size: 16px; }
      .field-wrap, button.submit { height: 56px; }
      button.submit { font-size: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <div class="auth-col">
      <div class="brand-lockup">
        <img class="brand-mark" src="./dragon-icon-gold.png" alt="" aria-hidden="true">
        <h1 class="brand brand-logo-wrap"><img class="brand-logo" src="./axiom-logo.png" alt="AXIOM" width="1000" height="252"></h1>
      </div>

      <section class="book" id="book">
        <span class="corner tl" aria-hidden="true"></span>
        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>
        <span class="gem-wrap top" aria-hidden="true"><span class="gem"></span></span>
        <span class="gem-wrap bottom" aria-hidden="true"><span class="gem"></span></span>

        <div class="tabs" role="tablist" aria-label="نوع العملية">
          <button id="tabLogin" role="tab" aria-selected="true" aria-controls="authForm" type="button"><span>تسجيل الدخول</span></button>
          <button id="tabSignup" role="tab" aria-selected="false" aria-controls="authForm" type="button"><span>إنشاء حساب</span></button>
        </div>

        <form class="fields" id="authForm" novalidate>
          <div class="field-wrap" id="emailWrap">
            <label class="sr-only" for="email">الإيميل</label>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2.5" y="5" width="19" height="14" rx="2" />
              <path d="M3 6.5l9 7 9-7" />
              <path d="M3 18l6.2-6M21 18l-6.2-6" />
            </svg>
            <input id="email" name="email" type="email" placeholder="الإيميل"
                   autocomplete="email" inputmode="email" required />
          </div>

          <div class="field-wrap has-eye" id="passwordWrap">
            <label class="sr-only" for="password">كلمة المرور</label>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="10" rx="2" />
              <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
              <circle cx="12" cy="15.5" r="1.2" />
            </svg>
            <input id="password" name="password" type="password" placeholder="كلمة المرور"
                   autocomplete="current-password" required minlength="6" />
            <button type="button" class="toggle-eye" id="togglePassword"
                    aria-pressed="false" aria-label="إظهار كلمة المرور" aria-controls="password">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
                <path class="slash" d="M4 20L20 4" />
              </svg>
            </button>
          </div>

          <div class="strength" id="strength" aria-hidden="true">
            <div>
              <div class="bars">
                <i></i><i></i><i></i><i></i>
              </div>
              <div class="strength-text" id="strengthText">اكتب 8 حروف على الأقل، وخلّي فيها أرقام ورموز.</div>
            </div>
          </div>

          <div class="submit-wrap">
            <button class="submit" id="submitBtn" type="submit">
              <span class="spinner" id="submitSpinner" aria-hidden="true"></span>
              <span id="submitLabel">دخول</span>
            </button>
          </div>
        </form>

        <p class="switch"><span id="switchText">معندكش حساب؟</span><button type="button" class="link" id="switchLink">إنشاء حساب</button></p>

        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="./supabase-config.js"></script>
  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);

    const els = {
      book: $("book"), form: $("authForm"),
      tabLogin: $("tabLogin"), tabSignup: $("tabSignup"),
      submitBtn: $("submitBtn"), submitLabel: $("submitLabel"),
      msg: $("msg"), email: $("email"), password: $("password"),
      emailWrap: $("emailWrap"), passwordWrap: $("passwordWrap"),
      togglePassword: $("togglePassword"),
      switchText: $("switchText"), switchLink: $("switchLink"),
      strength: $("strength"), strengthText: $("strengthText"),
      bars: document.querySelectorAll(".bars i"),
    };

    let mode = "login";
    let busy = false;

    /* ===================== device binding ===================== */

    // Creates and persists a browser-specific device ID.
    // The server-side Edge Function will use this ID to bind
    // the account to its first authorized browser/device.
    function getDeviceId() {
      let deviceId = localStorage.getItem("axiom_device_id");

      if (!deviceId) {
        deviceId = crypto.randomUUID();
        localStorage.setItem("axiom_device_id", deviceId);
      }

      return deviceId;
    }

    function getDeviceName() {
      return `${navigator.platform} / ${navigator.language}`;
    }

    // Calls the check-device Edge Function to confirm this browser is the
    // account's authorized device. Throws (with a machine-readable
    // `.message`) when it isn't, so the caller can sign the session back out.
    async function checkDeviceAccess(accessToken) {
      const response = await fetch(
        "https://lxbqnzfmhzbyypohysbb.supabase.co/functions/v1/check-device",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${accessToken}`,
          },
          body: JSON.stringify({
            device_id: getDeviceId(),
            device_name: getDeviceName(),
          }),
        }
      );

      const result = await response.json();
      if (!response.ok || !result.allowed) {
        throw new Error(result.reason || "device_not_allowed");
      }
      return result;
    }

    /* ===================== ui helpers ===================== */

    function showMsg(text, kind = "") {
      els.msg.textContent = "";
      // force the entrance animation to replay even for an identical message
      void els.msg.offsetWidth;
      els.msg.className = "msg" + (kind ? " " + kind : "");
      els.msg.textContent = text;
    }

    function shake() {
      els.book.classList.remove("shake");
      void els.book.offsetWidth;
      els.book.classList.add("shake");
    }

    function markInvalid(wrap) {
      wrap.classList.add("invalid");
      wrap.querySelector("input").addEventListener(
        "input", () => wrap.classList.remove("invalid"), { once: true }
      );
    }

    function fail(text, wrap) {
      showMsg(text, "error");
      shake();
      if (wrap) { markInvalid(wrap); wrap.querySelector("input").focus(); }
    }

    function setMode(m) {
      if (busy) return;
      mode = m;
      const isLogin = m === "login";
      els.tabLogin.setAttribute("aria-selected", String(isLogin));
      els.tabSignup.setAttribute("aria-selected", String(!isLogin));
      els.switchText.textContent = isLogin ? "معندكش حساب؟" : "عندك حساب؟";
      els.switchLink.textContent = isLogin ? "إنشاء حساب" : "سجّل دخول";
      els.submitLabel.textContent = isLogin ? "دخول" : "إنشاء الحساب";
      // correct autocomplete hint matters: it stops password managers from
      // saving the wrong credential and lets them offer a generated password
      els.password.setAttribute("autocomplete", isLogin ? "current-password" : "new-password");
      els.strength.classList.toggle("show", !isLogin);
      els.strength.setAttribute("aria-hidden", String(isLogin));
      if (!isLogin) updateStrength();
      showMsg("");
      els.emailWrap.classList.remove("invalid");
      els.passwordWrap.classList.remove("invalid");
    }

    function setLoading(isLoading, loadingText) {
      busy = isLoading;
      els.submitBtn.disabled = isLoading;
      els.submitBtn.classList.toggle("loading", isLoading);
      els.submitBtn.setAttribute("aria-busy", String(isLoading));
      if (isLoading) {
        els.submitBtn.dataset.prevLabel = els.submitLabel.textContent;
        els.submitLabel.textContent = loadingText;
      } else if (els.submitBtn.dataset.prevLabel) {
        els.submitLabel.textContent = els.submitBtn.dataset.prevLabel;
      }
    }

    /* ===================== returning from password reset ===================== */

    (function checkResetSuccess() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("reset") === "success") {
        showMsg("تم تغيير كلمة المرور بنجاح. سجّل دخولك بكلمة المرور الجديدة.", "ok");
        // ننضّف الرابط عشان الرسالة متتكررش لو المستخدم عمل refresh
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    })();

    /* ===================== password ===================== */

    els.togglePassword.addEventListener("click", () => {
      const nowVisible = els.password.type === "password";
      els.password.type = nowVisible ? "text" : "password";
      els.togglePassword.setAttribute("aria-pressed", String(nowVisible));
      els.togglePassword.setAttribute("aria-label", nowVisible ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
      els.password.focus();
    });

    const STRENGTH = [
      { text: "ضعيفة جداً", color: "#ff6b6b" },
      { text: "ضعيفة",      color: "#ff9a5a" },
      { text: "متوسطة",     color: "#e8c07d" },
      { text: "قوية",       color: "#8fd9ac" },
    ];

    function scorePassword(v) {
      if (!v) return -1;
      let s = 0;
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      return Math.min(3, Math.max(0, s - 1));
    }

    function updateStrength() {
      const v = els.password.value;
      const score = scorePassword(v);
      els.bars.forEach((bar, i) => {
        bar.style.background = (score >= 0 && i <= score)
          ? STRENGTH[score].color
          : "rgba(232, 241, 245, 0.14)";
      });
      els.strengthText.textContent = score < 0
        ? "اكتب 8 حروف على الأقل، وخلّي فيها أرقام ورموز."
        : "قوة كلمة المرور: " + STRENGTH[score].text;
    }

    els.password.addEventListener("input", () => { if (mode === "signup") updateStrength(); });

    /* ===================== tabs ===================== */

    els.tabLogin.addEventListener("click", () => setMode("login"));
    els.tabSignup.addEventListener("click", () => setMode("signup"));

    // arrow-key navigation between tabs, as expected from a real tablist
    [els.tabLogin, els.tabSignup].forEach((tab) => {
      tab.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        const next = mode === "login" ? els.tabSignup : els.tabLogin;
        setMode(mode === "login" ? "signup" : "login");
        next.focus();
      });
    });

    els.switchLink.addEventListener("click", () => setMode(mode === "login" ? "signup" : "login"));

    /* ===================== validation ===================== */

    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function validate(email, password) {
      if (!email) return { ok: false, text: "اكتب الإيميل الأول", wrap: els.emailWrap };
      if (!EMAIL_RE.test(email)) return { ok: false, text: "الإيميل ده مش شكله صح", wrap: els.emailWrap };
      if (!password) return { ok: false, text: "اكتب كلمة المرور", wrap: els.passwordWrap };
      if (mode === "signup" && password.length < 8) {
        return { ok: false, text: "كلمة المرور لازم تكون 8 حروف على الأقل", wrap: els.passwordWrap };
      }
      return { ok: true };
    }

    /* ===================== auth ===================== */

    // مهم: التحقق ده كله في المتصفح. الحماية الحقيقية لازم تكون Row Level
    // Security على جدول subscriptions في Supabase، بحيث المستخدم يقدر يقرأ
    // صفّه هو بس، ومايقدرش يعمل update على active أو expires_at نهائياً.
    function isSubscriptionValid(sub) {
      if (!sub || !sub.active) return false;
      if (sub.expires_at && new Date(sub.expires_at).getTime() < Date.now()) return false;
      return true;
    }

    async function routeAfterLogin(session) {
      const email = session.user.email;

      if (axiomIsAdmin(session.user)) {
        showMsg("أهلاً بيك يا أدمن، بنحوّلك...", "ok");
        window.location.href = "./admin.html";
        return;
      }

      const { data: sub, error } = await supabaseClient
        .from("subscriptions")
        .select("active, expires_at")
        .eq("id", session.user.id)
        .maybeSingle();

      if (error) {
        showMsg("مش قادرين نتأكد من الاشتراك دلوقتي. جرّب تاني بعد شوية.", "error");
        await supabaseClient.auth.signOut();
        return;
      }

      // OAuth users never pass through the sign-up form, so make sure they
      // have a (inactive) subscription row the admin can see and activate.
      if (!sub) {
        const { error: insErr } = await supabaseClient
          .from("subscriptions")
          .insert({ id: session.user.id, email, active: false });
        if (insErr && !String(insErr.message).toLowerCase().includes("duplicate")) {
          console.warn("subscriptions insert:", insErr.message);
        }
      }

      if (isSubscriptionValid(sub)) {
        showMsg("تمام، بنفتحلك المحرّك...", "ok");
        window.location.href = "./index.html";
        return;
      }

      // النوع ده من الرسايل بيفرق: المستخدم يعرف هو منتهي ولا لسه متفعّلش
      const expired = sub && sub.active && sub.expires_at;
      showMsg(
        expired
          ? "اشتراكك انتهى. كلّم الأدمن عشان يجدّدهولك."
          : "حسابك لسه متفعّلش. استنى تفعيل الأدمن للاشتراك.",
        "wait"
      );
      await supabaseClient.auth.signOut();
    }

    function friendlyAuthError(error, forMode) {
      const m = (error && error.message ? error.message : "").toLowerCase();
      if (m.includes("invalid login")) return "الإيميل أو كلمة المرور غلط";
      if (m.includes("email not confirmed")) return "لازم تأكّد الإيميل بتاعك الأول من الرسالة اللي وصلتك";
      if (m.includes("already registered") || m.includes("already been registered")) {
        return "الإيميل ده متسجّل قبل كده. جرّب تسجّل دخول.";
      }
      if (m.includes("rate limit") || m.includes("too many")) return "محاولات كتير. استنى دقيقة وجرّب تاني.";
      if (m.includes("password")) return "كلمة المرور مش مطابقة للشروط";
      if (m.includes("fetch") || m.includes("network")) return "مفيش اتصال بالنت. اتأكد من الشبكة وجرّب تاني.";
      return forMode === "login" ? "مش قادرين نسجّل دخولك دلوقتي. جرّب تاني." : "حصل خطأ أثناء إنشاء الحساب. جرّب تاني.";
    }

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (busy) return;

      const email = els.email.value.trim();
      const password = els.password.value;
      showMsg("");

      const check = validate(email, password);
      if (!check.ok) { fail(check.text, check.wrap); return; }

      setLoading(true, mode === "login" ? "بيتم الدخول..." : "بيتم الإنشاء...");

      try {
        if (mode === "login") {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) { fail(friendlyAuthError(error, "login")); return; }

          try {
            await checkDeviceAccess(data.session.access_token);
          } catch (deviceError) {
            await supabaseClient.auth.signOut();
            fail(
              deviceError.message === "different_device"
                ? "هذا الحساب مرتبط بجهاز آخر"
                : "تعذر التحقق من الجهاز"
            );
            return;
          }

          await routeAfterLogin(data.session);
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) { fail(friendlyAuthError(error, "signup")); return; }

          // بنسيب insert الصف للـ trigger في القاعدة لو موجود؛ لو مش موجود
          // بنحاول نعمله هنا، وأي خطأ (زي إن الصف موجود أصلاً) بنتجاهله
          if (data.user) {
            const { error: insErr } = await supabaseClient
              .from("subscriptions")
              .insert({ id: data.user.id, email, active: false });
            if (insErr && !String(insErr.message).toLowerCase().includes("duplicate")) {
              console.warn("subscriptions insert:", insErr.message);
            }
          }

          els.form.reset();
          updateStrength();
          showMsg("تم إنشاء الحساب. استنى تفعيل الأدمن للاشتراك عشان تقدر تدخل.", "wait");
        }
      } catch (err) {
        console.error(err);
        fail("حصل خطأ غير متوقع. اتأكد من الاتصال بالنت وجرّب تاني.");
      } finally {
        setLoading(false);
      }
    });

    /* ===================== existing session ===================== */

    (async function checkExistingSession() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          setLoading(true, "بنراجع جلستك...");

          try {
            await checkDeviceAccess(session.access_token);
          } catch (deviceError) {
            await supabaseClient.auth.signOut();
            setLoading(false);
            fail(
              deviceError.message === "different_device"
                ? "هذا الحساب مرتبط بجهاز آخر"
                : "تعذر التحقق من الجهاز"
            );
            return;
          }

          await routeAfterLogin(session);
          setLoading(false);
        }
      } catch (err) {
        console.error(err);
        setLoading(false);
      }
    })();
    </script>
</body>

</html>
