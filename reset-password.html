<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B262C" />
  <meta name="description" content="Axiom — إعادة تعيين كلمة المرور" />
  <title>Axiom — إعادة تعيين كلمة المرور</title>
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="./favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:wght@500;600&family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --void: #1B262C;
      --leather: #0F4C75;
      --leather-2: #1B262C;
      --parchment: #E8F1F5;
      --parchment-dim: rgba(232, 241, 245, 0.72);
      --gold: #D8A752;
      --gold-dim: rgba(216, 167, 82, 0.55);
      --border: rgba(50, 130, 184, 0.35);
      --border-soft: rgba(50, 130, 184, 0.18);
      --ember: #C98A4A;
      --ember-dim: rgba(201, 138, 74, 0.5);
      --error: #ff9a9a;
      --ok: #8fd9ac;
      --wait: #e8c07d;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      font-family: 'Tajawal', system-ui, sans-serif;
      color: var(--parchment);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 40px);
      background:
        radial-gradient(ellipse 70% 50% at 20% 0%, rgba(50, 130, 184, 0.16), transparent 60%),
        radial-gradient(ellipse 70% 50% at 100% 100%, rgba(201, 138, 74, 0.08), transparent 55%),
        linear-gradient(180deg, var(--void) 0%, var(--leather-2) 55%, var(--void) 100%);
    }

    body::before {
      content: '';
      position: fixed;
      inset: -40px;
      background-image: radial-gradient(rgba(232, 241, 245, 0.10) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.3;
      pointer-events: none;
      z-index: -1;
      animation: drift 40s linear infinite;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(26px, 26px); }
    }

    /* ===================== card ===================== */
    .book {
      width: 100%;
      max-width: 860px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: linear-gradient(180deg, rgba(15, 76, 117, 0.92), rgba(27, 38, 44, 0.94));
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      overflow: hidden;
      animation: cardIn 0.7s var(--ease) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }

    .book.shake { animation: shake 0.42s ease; }

    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }

    .spine { position: relative; }

    .spine::after {
      content: '';
      position: absolute;
      top: 8%;
      bottom: 8%;
      inset-inline-end: 0;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--border), transparent);
    }

    /* ===================== form ===================== */
    .leaf-form {
      padding: clamp(28px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* staggered entrance for everything inside the form */
    .leaf-form > *, .fields > * {
      animation: riseIn 0.6s var(--ease) both;
    }
    .leaf-form > *:nth-child(1) { animation-delay: 0.10s; }
    .leaf-form > *:nth-child(2) { animation-delay: 0.16s; }
    .leaf-form > *:nth-child(3) { animation-delay: 0.22s; }
    .leaf-form > *:nth-child(4) { animation-delay: 0.28s; }
    .leaf-form > *:nth-child(5) { animation-delay: 0.34s; }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .greeting {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--gold);
      margin: 0 0 4px;
      min-height: 18px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 2px;
    }

    .brand-mark {
      width: 28px;
      height: auto;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(216, 167, 82, 0.45));
    }

    .brand {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.02em;
      margin: 0;
    }

    .sub {
      margin: 0 0 24px;
      color: var(--parchment-dim);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 34ch;
    }

    /* ---- tabs with a sliding indicator ---- */
    .tabs {
      position: relative;
      display: flex;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 8px;
    }

    .tabs button {
      flex: 1;
      padding: 10px 4px;
      background: transparent;
      border: none;
      color: var(--parchment-dim);
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.25s var(--ease);
    }

    .tabs button[aria-selected="true"] { color: var(--parchment); font-weight: 700; }

    .tab-indicator {
      position: absolute;
      bottom: -1px;
      height: 2px;
      width: 50%;
      background: var(--gold);
      border-radius: 2px;
      transition: transform 0.35s var(--ease);
    }
    /* RTL: login tab is on the right */
    .tab-indicator[data-mode="login"]  { transform: translateX(0); }
    .tab-indicator[data-mode="signup"] { transform: translateX(-100%); }

    .fields { display: flex; flex-direction: column; }

    label {
      display: block;
      font-size: 13px;
      color: var(--parchment-dim);
      margin: 16px 0 6px;
    }

    .field-wrap { position: relative; }

    input {
      width: 100%;
      padding: 11px 2px;
      border: none;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--parchment);
      font-size: 15.5px;
      font-family: inherit;
      transition: border-color 0.25s var(--ease);
    }

    input::placeholder { color: rgba(232, 241, 245, 0.35); }
    input:focus { outline: none; }
    input:focus-visible { outline: none; }

    /* animated underline that grows from the center on focus */
    .field-wrap::after {
      content: '';
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.3s var(--ease), background-color 0.2s ease;
    }
    .field-wrap:focus-within::after { transform: scaleX(1); }
    .field-wrap.invalid::after { transform: scaleX(1); background: var(--error); }

    .field-wrap.has-eye input { padding-inline-start: 34px; }

    .toggle-eye {
      position: absolute;
      inset-inline-start: 0;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      line-height: 0;
      color: var(--parchment);
      opacity: 0.5;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }
    .toggle-eye:hover { opacity: 0.95; }
    .toggle-eye svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .toggle-eye .slash { stroke-dasharray: 26; stroke-dashoffset: 26; transition: stroke-dashoffset 0.25s var(--ease); }
    .toggle-eye[aria-pressed="true"] .slash { stroke-dashoffset: 0; }

    /* ---- password strength (signup only) ---- */
    .strength {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.35s var(--ease), opacity 0.25s ease, margin 0.35s var(--ease);
      margin-top: 0;
    }
    .strength.show { grid-template-rows: 1fr; opacity: 1; margin-top: 10px; }
    .strength > div { overflow: hidden; }

    .bars { display: flex; gap: 5px; }
    .bars i {
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(232, 241, 245, 0.14);
      transition: background-color 0.3s var(--ease);
    }
    .strength-text { font-size: 12px; margin-top: 6px; color: var(--parchment-dim); }

    /* ---- extra signup row ---- */
    .row-extra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 13px;
    }
    .link {
      background: none;
      border: none;
      padding: 0;
      color: var(--gold);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }
    .link:hover { color: var(--parchment); }

    .back-row { margin-top: 18px; text-align: center; font-size: 13px; }

    /* ---- submit ---- */
    button.submit {
      position: relative;
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid var(--ember-dim);
      background: linear-gradient(180deg, var(--ember), #A8703A);
      color: #1B140C;
      font-weight: 800;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      overflow: hidden;
      transition: filter 0.2s ease, transform 0.12s ease, box-shadow 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    button.submit:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 8px 22px rgba(201, 138, 74, 0.22);
    }
    button.submit:active:not(:disabled) { transform: scale(0.985); }
    button.submit:disabled { opacity: 0.7; cursor: not-allowed; }

    /* sheen sweep while loading */
    button.submit.loading::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      animation: sheen 1.15s linear infinite;
    }
    @keyframes sheen {
      from { transform: translateX(-100%); }
      to   { transform: translateX(100%); }
    }

    .spinner {
      display: none;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(27, 20, 12, 0.3);
      border-top-color: #1B140C;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    button.submit.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    :where(button, input, a):focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
      border-radius: 6px;
    }

    /* ---- message ---- */
    .msg {
      margin-top: 14px;
      font-size: 13.5px;
      text-align: center;
      min-height: 20px;
      line-height: 1.55;
    }
    .msg:not(:empty) { animation: msgIn 0.35s var(--ease) both; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }
    .msg.error { color: var(--error); }
    .msg.ok    { color: var(--ok); }
    .msg.wait  { color: var(--wait); }

    /* ===================== hero ===================== */
    .leaf-hero {
      padding: clamp(28px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 20%, rgba(50, 130, 184, 0.14), transparent 65%);
      animation: riseIn 0.7s var(--ease) 0.2s both;
    }

    .hero-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 15px;
      color: var(--gold);
      margin: 0;
    }

    .hero-title {
      font-family: 'Cinzel', 'Tajawal', serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 1.5;
      margin: 0;
    }

    .hero-desc {
      font-size: 14px;
      line-height: 1.75;
      color: var(--parchment-dim);
      margin: 0;
      max-width: 32ch;
    }

    /* ---- merge diagram: a real 4s merge loop ---- */
    .merge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 10px 0 4px;
      min-height: 66px;
    }

    .token {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 35% 30%, rgba(232, 241, 245, 0.14), rgba(15, 76, 117, 0.6));
      border: 1px solid var(--border);
    }

    .token svg { width: 24px; height: 24px; stroke: var(--parchment); fill: none; stroke-width: 1.4; }

    .token.a { animation: mergeA 4s var(--ease) infinite; }
    .token.b { animation: mergeB 4s var(--ease) infinite; }
    .plus, .arrow { animation: fadeMid 4s var(--ease) infinite; }

    .plus  { color: var(--gold-dim); font-size: 15px; }
    .arrow { color: var(--parchment-dim); font-size: 15px; transform: scaleX(-1); }

    .token.result {
      width: 62px;
      height: 62px;
      border-color: var(--ember-dim);
      animation: pop 4s var(--ease) infinite;
    }
    .token.result svg { width: 30px; height: 30px; stroke: var(--ember); }

    /* the two tokens slide together, fade, then the result pops */
    @keyframes mergeA {
      0%, 20%   { transform: translateX(0) scale(1); opacity: 1; }
      45%       { transform: translateX(-26px) scale(0.9); opacity: 1; }
      55%, 85%  { transform: translateX(-26px) scale(0.6); opacity: 0; }
      100%      { transform: translateX(0) scale(1); opacity: 1; }
    }
    @keyframes mergeB {
      0%, 20%   { transform: translateX(0) scale(1); opacity: 1; }
      45%       { transform: translateX(26px) scale(0.9); opacity: 1; }
      55%, 85%  { transform: translateX(26px) scale(0.6); opacity: 0; }
      100%      { transform: translateX(0) scale(1); opacity: 1; }
    }
    @keyframes fadeMid {
      0%, 25%  { opacity: 1; }
      45%, 85% { opacity: 0; }
      100%     { opacity: 1; }
    }
    @keyframes pop {
      0%, 45%  { transform: scale(1); box-shadow: 0 0 0 0 rgba(201, 138, 74, 0); }
      58%      { transform: scale(1.18); box-shadow: 0 0 26px 6px rgba(201, 138, 74, 0.4); }
      72%      { transform: scale(1); box-shadow: 0 0 14px 2px rgba(201, 138, 74, 0.2); }
      100%     { transform: scale(1); box-shadow: 0 0 0 0 rgba(201, 138, 74, 0); }
    }

    /* ===================== responsive ===================== */
    @media (max-width: 760px) {
      .book { grid-template-columns: 1fr; }
      .spine::after { display: none; }
      .leaf-hero { order: -1; padding-bottom: 8px; gap: 14px; }
      .leaf-form { padding-top: 8px; }
      .hero-desc { max-width: none; }
      .hero-title { font-size: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="book" id="book">
    <section class="leaf-form spine">
      <div class="brand-lockup">
        <img class="brand-mark" src="./dragon-icon-gold.png" alt="" aria-hidden="true">
        <h1 class="brand">Axiom</h1>
      </div>
      <p class="sub" id="introText">بنتحقق من صلاحية الرابط...</p>

      <form class="fields" id="resetForm" novalidate>
        <label for="password">كلمة المرور الجديدة</label>
        <div class="field-wrap has-eye" id="passwordWrap">
          <button type="button" class="toggle-eye" id="togglePassword1"
                  aria-pressed="false" aria-label="إظهار كلمة المرور" aria-controls="password">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
              <path class="slash" d="M4 20L20 4" />
            </svg>
          </button>
          <input id="password" name="password" type="password" placeholder="••••••••"
                 autocomplete="new-password" required minlength="8" />
        </div>

        <div class="strength show" id="strength">
          <div>
            <div class="bars">
              <i></i><i></i><i></i><i></i>
            </div>
            <div class="strength-text" id="strengthText">اكتب 8 حروف على الأقل، وخلّي فيها أرقام ورموز.</div>
          </div>
        </div>

        <label for="password2">تأكيد كلمة المرور</label>
        <div class="field-wrap has-eye" id="password2Wrap">
          <button type="button" class="toggle-eye" id="togglePassword2"
                  aria-pressed="false" aria-label="إظهار كلمة المرور" aria-controls="password2">
            <svg viewBox="0 0 24 24">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
              <path class="slash" d="M4 20L20 4" />
            </svg>
          </button>
          <input id="password2" name="password2" type="password" placeholder="••••••••"
                 autocomplete="new-password" required minlength="8" />
        </div>

        <button class="submit" id="submitBtn" type="submit" disabled>
          <span class="spinner" id="submitSpinner" aria-hidden="true"></span>
          <span id="submitLabel">تحديث كلمة المرور</span>
        </button>
      </form>

      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <p class="back-row" id="backRow" style="display:none;"><a class="link" href="./forgot-password.html">اطلب رابط جديد</a></p>
    </section>

    <section class="leaf-hero">
      <p class="hero-eyebrow">The Bestiary Trial</p>
      <h2 class="hero-title">اتنين من نفس النوع بيتحدوا ويطلعوا وحش أقوى</h2>

      <div class="merge" aria-hidden="true">
        <div class="token a">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.7-4 4 1 5.5L12 15.8 7 18.2l1-5.5-4-4 5.5-.7z"/></svg>
        </div>
        <span class="plus">+</span>
        <div class="token b">
          <svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.7-4 4 1 5.5L12 15.8 7 18.2l1-5.5-4-4 5.5-.7z"/></svg>
        </div>
        <span class="arrow">←</span>
        <div class="token result">
          <svg viewBox="0 0 24 24"><path d="M12 2l3 6 6.5.9-4.7 4.6 1.1 6.5L12 16.8 6.1 20l1.1-6.5L2.5 8.9 9 8z"/></svg>
        </div>
      </div>

      <p class="hero-desc">كل مستوى وحش جديد، لحد ما توصل للمستوى 11 وتتحرر اللوحة منه. الحل الذكي اللي جوّه بيحسبلك أفضل حركة في كل خطوة.</p>
    </section>
  </main>

  <script src="./supabase-config.js"></script>
  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);

    const els = {
      book: $("book"), form: $("resetForm"),
      password: $("password"), password2: $("password2"),
      passwordWrap: $("passwordWrap"), password2Wrap: $("password2Wrap"),
      togglePassword1: $("togglePassword1"), togglePassword2: $("togglePassword2"),
      strength: $("strength"), strengthText: $("strengthText"),
      bars: document.querySelectorAll(".bars i"),
      submitBtn: $("submitBtn"), submitLabel: $("submitLabel"),
      msg: $("msg"), intro: $("introText"), backRow: $("backRow"),
    };

    let busy = false;
    let ready = false;

    /* ===================== ui helpers (same patterns as login.html) ===================== */

    function showMsg(text, kind = "") {
      els.msg.textContent = "";
      void els.msg.offsetWidth;
      els.msg.className = "msg" + (kind ? " " + kind : "");
      els.msg.textContent = text;
    }

    function shake() {
      els.book.classList.remove("shake");
      void els.book.offsetWidth;
      els.book.classList.add("shake");
    }

    function markInvalid(wrap) {
      wrap.classList.add("invalid");
      wrap.querySelector("input").addEventListener(
        "input", () => wrap.classList.remove("invalid"), { once: true }
      );
    }

    function fail(text, wrap) {
      showMsg(text, "error");
      shake();
      if (wrap) { markInvalid(wrap); wrap.querySelector("input").focus(); }
    }

    function setLoading(isLoading, loadingText) {
      busy = isLoading;
      els.submitBtn.disabled = isLoading;
      els.submitBtn.classList.toggle("loading", isLoading);
      els.submitBtn.setAttribute("aria-busy", String(isLoading));
      if (isLoading) {
        els.submitBtn.dataset.prevLabel = els.submitLabel.textContent;
        els.submitLabel.textContent = loadingText;
      } else if (els.submitBtn.dataset.prevLabel) {
        els.submitLabel.textContent = els.submitBtn.dataset.prevLabel;
      }
    }

    /* ===================== password visibility + strength ===================== */

    function wireToggle(btn, input) {
      btn.addEventListener("click", () => {
        const nowVisible = input.type === "password";
        input.type = nowVisible ? "text" : "password";
        btn.setAttribute("aria-pressed", String(nowVisible));
        btn.setAttribute("aria-label", nowVisible ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
        input.focus();
      });
    }
    wireToggle(els.togglePassword1, els.password);
    wireToggle(els.togglePassword2, els.password2);

    const STRENGTH = [
      { text: "ضعيفة جداً", color: "#ff6b6b" },
      { text: "ضعيفة",      color: "#ff9a5a" },
      { text: "متوسطة",     color: "#e8c07d" },
      { text: "قوية",       color: "#8fd9ac" },
    ];

    function scorePassword(v) {
      if (!v) return -1;
      let s = 0;
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
      if (/\d/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      return Math.min(3, Math.max(0, s - 1));
    }

    function updateStrength() {
      const v = els.password.value;
      const score = scorePassword(v);
      els.bars.forEach((bar, i) => {
        bar.style.background = (score >= 0 && i <= score)
          ? STRENGTH[score].color
          : "rgba(232, 241, 245, 0.14)";
      });
      els.strengthText.textContent = score < 0
        ? "اكتب 8 حروف على الأقل، وخلّي فيها أرقام ورموز."
        : "قوة كلمة المرور: " + STRENGTH[score].text;
    }
    els.password.addEventListener("input", updateStrength);

    /* ===================== recovery-link verification ===================== */
    // Supabase بيحط توكن الاسترجاع في الرابط، والعميل بيعالجه تلقائياً
    // ويطلق event من نوع PASSWORD_RECOVERY. لحد ما ده يحصل، الفورم مقفول.

    function unlockForm() {
      if (ready) return;
      ready = true;
      showMsg("");
      els.intro.textContent = "اكتب كلمة مرور جديدة لحسابك.";
      els.submitBtn.disabled = false;
      els.password.focus();
    }

    function showInvalidLink() {
      if (ready) return;
      els.form.style.display = "none";
      els.intro.textContent = "";
      els.backRow.style.display = "";
      showMsg("الرابط غير صالح أو انتهت صلاحيته. تقدر تطلب رابط جديد.", "error");
    }

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") unlockForm();
    });

    (async function verifyRecoveryLink() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) { unlockForm(); return; }
      } catch (err) {
        console.error(err);
      }
      // بنستنى شوية لحد ما الـ client يخلّص معالجة التوكن من الرابط
      setTimeout(async () => {
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session) unlockForm(); else showInvalidLink();
        } catch (err) {
          console.error(err);
          showInvalidLink();
        }
      }, 1500);
    })();

    /* ===================== submit new password ===================== */

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (busy || !ready) return;

      const p1 = els.password.value;
      const p2 = els.password2.value;
      showMsg("");

      if (!p1 || p1.length < 8) {
        fail("كلمة المرور لازم تكون 8 حروف على الأقل", els.passwordWrap);
        return;
      }
      if (p1 !== p2) {
        fail("كلمتا المرور مش متطابقتين", els.password2Wrap);
        return;
      }

      setLoading(true, "بيتم التحديث...");
      try {
        const { error } = await supabaseClient.auth.updateUser({ password: p1 });
        if (error) {
          const m = (error.message || "").toLowerCase();
          fail(
            m.includes("password") ? "كلمة المرور مش مطابقة للشروط المطلوبة" :
            m.includes("rate limit") || m.includes("too many") ? "محاولات كتير. استنى شوية وجرّب تاني." :
            "مش قادرين نحدّث كلمة المرور دلوقتي. جرّب تاني.",
            els.passwordWrap
          );
          return;
        }

        showMsg("تم تحديث كلمة المرور بنجاح. بنحوّلك لتسجيل الدخول...", "ok");
        els.submitBtn.disabled = true;

        // بنسجّل خروج من جلسة الاسترجاع عشان يدخل من جديد بكلمة المرور
        // الجديدة، وعشان يعدّي على فحص الجهاز المعتاد بدل ما يتخطّاه
        await supabaseClient.auth.signOut();
        setTimeout(() => {
          window.location.href = "./login.html?reset=success";
        }, 1400);
      } catch (err) {
        console.error(err);
        fail("حصل خطأ غير متوقع. اتأكد من الاتصال بالنت وجرّب تاني.");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>

</html>
