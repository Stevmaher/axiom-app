<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030C14" />
  <meta name="color-scheme" content="dark light" />
  <script>(function(){try{var m=localStorage.getItem("axiomAdminTheme")||"dark";var r=m==="auto"?(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):m;document.documentElement.setAttribute("data-theme",r);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
  <meta name="robots" content="noindex, nofollow" />
  <title>Axiom — لوحة الأدمن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
        rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
    integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <style>
    :root {
      --void: #030C14;
      --deep: #082338;
      --parchment: #E9EEF3;
      --dim: rgba(233, 238, 243, 0.6);
      --dimmer: rgba(233, 238, 243, 0.4);
      --gold: #E8A92E;
      --border: rgba(232, 169, 46, 0.35);
      --border-soft: rgba(232, 169, 46, 0.18);
      --good: #3ddc84;
      --bad: #ff6b6b;
      --warn: #ffc94d;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { background: var(--void); }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Tajawal', system-ui, sans-serif;
      color: var(--parchment);
      background: linear-gradient(180deg, var(--void) 0%, #061826 55%, var(--void) 100%);
      background-attachment: fixed;
      padding: clamp(14px, 3vw, 26px);
    }

    .wrap { max-width: 1280px; margin: 0 auto; }

    :where(button, input, select, a):focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* ===================== header ===================== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      animation: rise 0.5s var(--ease) both;
    }

    h1 { margin: 0; font-family: 'Cinzel', 'Tajawal', sans-serif; font-weight: 700; font-size: 24px; }
    h1 span { color: var(--gold); }
    h1 .brand-logo { height: 30px; width: auto; vertical-align: middle; margin-inline-start: 6px; }

    .who { font-size: 13px; color: var(--dimmer); margin-top: 6px; }

    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(232, 169, 46, 0.2);
      color: var(--parchment);
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: background 0.18s ease, transform 0.12s ease, opacity 0.2s ease;
    }
    .btn:hover:not(:disabled) { background: rgba(232, 169, 46, 0.35); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.primary { background: linear-gradient(180deg, #F9D878, #D18C1C); border-color: #FFE9A0; color: #2A1805; font-weight: 800; }
    .btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #FBE08A, #DB9722); }
    .btn.danger { background: rgba(255, 107, 107, 0.15); border-color: rgba(255, 107, 107, 0.4); color: var(--bad); }
    .btn.danger:hover:not(:disabled) { background: rgba(255, 107, 107, 0.28); }

    #refreshBtn.spinning svg { animation: spin 0.8s linear infinite; }
    .btn svg { width: 14px; height: 14px; vertical-align: -2px; margin-inline-start: 5px; fill: none; stroke: currentColor; stroke-width: 2; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===================== stats ===================== */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat {
      position: relative;
      background: linear-gradient(180deg, rgba(6, 28, 46, 0.55), rgba(3, 12, 20, 0.85));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      overflow: hidden;
      transition: transform 0.2s var(--ease), border-color 0.2s ease;
      animation: rise 0.55s var(--ease) both;
    }
    .stat:nth-child(1) { animation-delay: 0.05s; }
    .stat:nth-child(2) { animation-delay: 0.10s; }
    .stat:nth-child(3) { animation-delay: 0.15s; }
    .stat:nth-child(4) { animation-delay: 0.20s; }
    .stat:hover { transform: translateY(-2px); border-color: var(--gold); }

    .stat::after {
      content: '';
      position: absolute;
      inset-inline-start: 0;
      top: 0; bottom: 0;
      width: 3px;
      background: var(--gold);
      opacity: 0.5;
    }
    .stat.good::after { background: var(--good); }
    .stat.warn::after { background: var(--warn); }
    .stat.bad::after  { background: var(--bad); }

    .stat .num { font-size: 28px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat .lbl { font-size: 13px; color: var(--dim); margin-top: 2px; }
    .stat.good .num { color: var(--good); }
    .stat.bad  .num { color: var(--bad); }
    .stat.warn .num { color: var(--warn); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    /* ===================== panel ===================== */
    .panel {
      background: linear-gradient(180deg, rgba(6, 28, 46, 0.94), rgba(3, 12, 20, 0.94));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      margin-bottom: 20px;
      animation: rise 0.55s var(--ease) 0.22s both;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
    }

    .search-wrap { position: relative; flex: 1 1 280px; min-width: 200px; }
    .search-wrap svg {
      position: absolute;
      inset-inline-start: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px; height: 15px;
      stroke: var(--dimmer); fill: none; stroke-width: 2;
      pointer-events: none;
    }
    .search-wrap input { padding-inline-start: 36px; margin: 0; }

    input, select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--parchment);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input { width: 100%; margin-bottom: 10px; }
    input:focus, select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(232, 169, 46, 0.18);
    }
    input::placeholder { color: var(--dimmer); }
    select option { background: var(--void); }

    .count { font-size: 13px; color: var(--dimmer); white-space: nowrap; }
    .toolbar select, .search-wrap input { height: 44px; }
    .toolbar select { padding-inline: 14px; min-width: 150px; }

    /* ===================== table ===================== */
    .table-scroll { overflow-x: auto; margin: 0 -6px; padding: 0 6px; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
      min-width: 1040px;
    }

    th, td {
      padding: 15px 14px;
      text-align: right;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
    }

    th {
      padding-block: 13px;
      color: var(--dim);
      font-weight: 600;
      font-size: 12.5px;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.24);
      border-bottom: 1px solid var(--border);
    }
    th:first-child { border-start-start-radius: 10px; }
    th:last-child  { border-start-end-radius: 10px; }
    th.sortable { cursor: pointer; user-select: none; transition: color 0.15s ease; }
    th.sortable:hover { color: var(--parchment); }
    th .caret { opacity: 0; font-size: 10px; transition: opacity 0.2s ease, transform 0.2s ease; display: inline-block; }
    th[aria-sort] .caret { opacity: 1; }
    th[aria-sort="ascending"] .caret { transform: rotate(180deg); }

    tbody tr { transition: background 0.15s ease; animation: rowIn 0.35s var(--ease) both; }
    tbody tr:hover { background: rgba(232, 169, 46, 0.09); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.removing { animation: rowOut 0.3s var(--ease) forwards; }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes rowOut {
      to { opacity: 0; transform: translateX(-20px); }
    }

    td.acct { min-width: 250px; }
    .acct-email { font-weight: 700; font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; }
    .acct-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      margin-top: 7px;
      font-size: 12px;
      color: var(--dimmer);
    }
    .chip {
      padding: 2px 9px;
      border-radius: 6px;
      background: rgba(232, 169, 46, 0.2);
      border: 1px solid var(--border-soft);
      color: var(--dim);
      font-size: 11.5px;
    }
    th:nth-child(2) { width: 92px; }
    th:nth-child(3) { width: 170px; }
    th:nth-child(4) { width: 190px; }
    th:nth-child(5) { width: 150px; }
    th:nth-child(6) { width: 220px; }
    td.actions-cell { width: 220px; }

    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }
    .badge.active   { background: rgba(61, 220, 132, 0.15); color: var(--good); }
    .badge.inactive { background: rgba(255, 107, 107, 0.15); color: var(--bad); }
    .badge.expired  { background: rgba(255, 201, 77, 0.15); color: var(--warn); }

    .days { font-weight: 700; font-variant-numeric: tabular-nums; }
    .days { white-space: nowrap; }
    .dev .days { font-size: 12.5px; }
    .days.ok   { color: var(--good); }
    .days.soon { color: var(--warn); }
    .days.over { color: var(--bad); }
    .days.none { color: var(--dimmer); font-weight: 400; }

    .dev { display: flex; flex-direction: column; gap: 4px; }
    .dev b { font-weight: 700; font-size: 13.5px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .dev small { color: var(--dimmer); font-size: 11.5px; white-space: nowrap; }
    .dev small.reset-tag { color: var(--warn); font-weight: 700; }
    .dev small.info-tag { color: var(--dimmer); }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    button.mini {
      padding: 9px 10px;
      white-space: nowrap;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      color: #111;
      transition: filter 0.15s ease, transform 0.12s ease, opacity 0.2s ease;
    }
    button.mini:hover:not(:disabled) { filter: brightness(1.12); }
    button.mini:active:not(:disabled) { transform: scale(0.95); }
    button.mini:disabled { opacity: 0.5; cursor: wait; }
    button.mini.on  { background: var(--good); }
    button.mini.off { background: var(--bad); color: #fff; }
    button.mini.ext { background: var(--gold); color: #2A1805; }
    button.mini.del { background: rgba(255, 107, 107, 0.18); color: var(--bad); border: 1px solid rgba(255, 107, 107, 0.4); }
    button.mini.reset { background: rgba(255, 201, 77, 0.18); color: var(--warn); border: 1px solid rgba(255, 201, 77, 0.4); }

    /* skeleton loading */
    .sk {
      display: block;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(233, 238, 243,.07) 25%, rgba(233, 238, 243,.16) 50%, rgba(233, 238, 243,.07) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.3s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    .empty-state { text-align: center; padding: 34px 10px; color: var(--dimmer); font-size: 14px; }

    /* ===================== gate ===================== */
    #gate {
      max-width: 400px;
      margin: clamp(40px, 12vh, 90px) auto;
      text-align: center;
      background: linear-gradient(180deg, rgba(6, 28, 46, 0.94), rgba(3, 12, 20, 0.94));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 26px;
      animation: rise 0.5s var(--ease) both;
    }
    #gate.shake { animation: shake 0.42s ease; }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }

    #gate h1 { font-size: 22px; margin-bottom: 6px; }
    #gate .hint { font-size: 13px; color: var(--dim); margin: 0 0 18px; }
    #gate button[type="submit"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(180deg, #F9D878, #D18C1C);
      color: #2A1805;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      transition: background 0.18s ease, opacity 0.2s ease;
    }
    #gate button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }

    .msg { font-size: 13px; margin-top: 10px; color: var(--bad); min-height: 18px; }
    .muted { color: rgba(233, 238, 243, 0.55); font-size: 13px; }

    /* ===================== modal ===================== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s;
    }
    .overlay.show { opacity: 1; visibility: visible; }

    .modal {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(6, 28, 46, 0.98), rgba(3, 12, 20, 0.98));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      transform: translateY(14px) scale(0.97);
      opacity: 0;
      transition: transform 0.28s var(--ease), opacity 0.22s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    .overlay.show .modal { transform: none; opacity: 1; }

    .modal h2 { margin: 0 0 6px; font-size: 18px; }
    .modal .sub { font-size: 13px; color: var(--dim); margin-bottom: 16px; word-break: break-all; }

    .quick { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .quick button {
      flex: 1;
      min-width: 64px;
      padding: 8px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(232, 169, 46, 0.15);
      color: var(--parchment);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .quick button:hover { background: rgba(232, 169, 46, 0.35); }
    .quick button.sel { background: var(--gold); border-color: var(--gold); color: #2A1805; font-weight: 800; }

    .preview { font-size: 12.5px; color: var(--dim); margin: -2px 0 12px; min-height: 17px; }
    .preview b { color: var(--good); font-weight: 700; }

    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
    .modal-actions .btn { flex: 1; }

    label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }

    /* ===================== toasts ===================== */
    #toasts {
      position: fixed;
      bottom: 20px;
      inset-inline-start: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(18, 40, 52, 0.97);
      border: 1px solid var(--border);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
      font-size: 13.5px;
      max-width: 340px;
      animation: toastIn 0.35s var(--ease) both;
    }
    .toast.out { animation: toastOut 0.3s var(--ease) forwards; }
    .toast::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--gold);
    }
    .toast.ok::before  { background: var(--good); }
    .toast.err::before { background: var(--bad); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-24px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateX(-24px); }
    }

    /* ===================== tablet + mobile: rows become cards ===================== */
    @media (max-width: 1160px) {
      table, thead, tbody, tr, td { display: block; }
      thead { display: none; }
      table { min-width: 0; }
      .table-scroll { margin: 0; padding: 0; overflow: visible; }

      tbody {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
        gap: 14px;
      }

      tbody tr {
        position: relative;
        border: 1px solid var(--border-soft);
        border-radius: 14px;
        padding: 16px 18px 16px;
        background: rgba(0, 0, 0, 0.18);
      }

      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 9px 0;
        border: none;
      }
      td::before {
        content: attr(data-label);
        color: var(--dim);
        font-size: 12.5px;
        flex-shrink: 0;
      }
      td .dev { align-items: flex-end; text-align: left; }

      tbody tr td.acct {
        display: block;
        min-width: 0;
        padding: 0 0 14px;
        margin-bottom: 4px;
        padding-inline-end: 84px;
        border-bottom: 1px solid var(--border-soft);
      }
      td.acct::before { display: none; }

      td.col-status { position: absolute; top: 16px; inset-inline-end: 18px; padding: 0; }
      td.col-status::before { display: none; }

      tbody tr td.actions-cell {
        display: block;
        width: auto;
        margin-top: 6px;
        padding: 14px 0 0;
        border-top: 1px solid var(--border-soft);
      }
      td.actions-cell::before { display: none; }
    }

    @media (max-width: 560px) {
      body { padding: 14px; }
      header { margin-bottom: 20px; }
      .header-actions { width: 100%; }
      .header-actions .btn { flex: 1 1 auto; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
      .stat { padding: 16px; }
      .panel { padding: 16px; }
      tbody tr td.acct { padding-inline-end: 0; }
      td.col-status { position: static; display: flex; padding: 9px 0; }
      td.col-status::before { content: "الحالة"; display: block; }
      .search-wrap { flex-basis: 100%; }
      .toolbar select { flex: 1; min-width: 0; }
      .count { width: 100%; }
      #toasts { inset-inline: 14px; bottom: 14px; }
      .toast { max-width: none; }
    }


    /* ===================== light theme ===================== */
    :root[data-theme="light"] {
      --void: #f3f5fa;
      --deep: #ffffff;
      --parchment: #0e1526;
      --dim: rgba(14, 21, 38, 0.68);
      --dimmer: rgba(14, 21, 38, 0.5);
      --gold: #b87a0a;
      --border: rgba(184, 122, 10, 0.45);
      --border-soft: rgba(14, 21, 38, 0.12);
      --good: #12805c;
      --bad: #d4303c;
      --warn: #a86a00;
    }
    :root[data-theme="light"] html, :root[data-theme="light"] body { background: var(--void); }
    :root[data-theme="light"] body { background: linear-gradient(180deg, #f3f5fa 0%, #eaeef6 100%); background-attachment: fixed; }
    :root[data-theme="light"] .stat,
    :root[data-theme="light"] .panel,
    :root[data-theme="light"] #gate,
    :root[data-theme="light"] .modal { background: #ffffff; box-shadow: 0 6px 24px rgba(14, 21, 38, 0.06); }
    :root[data-theme="light"] input,
    :root[data-theme="light"] select { background: #f5f7fc; }
    :root[data-theme="light"] select option { background: #fff; color: #0e1526; }
    :root[data-theme="light"] th { background: #f1f4fa; }
    :root[data-theme="light"] tbody tr:hover { background: rgba(184, 122, 10, 0.08); }
    :root[data-theme="light"] .btn { background: rgba(184, 122, 10, 0.12); }
    :root[data-theme="light"] .btn:hover:not(:disabled) { background: rgba(184, 122, 10, 0.24); }
    :root[data-theme="light"] .btn.primary { background: linear-gradient(180deg, #F9D878, #D18C1C); }
    :root[data-theme="light"] .btn.danger { background: rgba(212, 48, 60, 0.1); }
    :root[data-theme="light"] .chip { background: rgba(184, 122, 10, 0.12); }
    :root[data-theme="light"] .toast { background: #0e1526; color: #fff; }
    :root[data-theme="light"] .overlay { background: rgba(14, 21, 38, 0.4); }
    :root[data-theme="light"] .quick button { background: rgba(184, 122, 10, 0.1); }
    :root[data-theme="light"] button.mini.on { color: #fff; background: var(--good); }
    :root[data-theme="light"] button.mini.ext { background: #e8a92e; }

      :root[data-theme="light"] tbody tr { background: #fafbfe; }
    }

    /* ===================== tabs / stamp / overview ===================== */
    .btn.toggle[aria-pressed="true"] { background: rgba(232, 169, 46, 0.4); border-color: var(--gold); }

    .tabs { display: flex; gap: 4px; margin: -8px 0 8px; border-bottom: 1px solid var(--border-soft); overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      border: 0; background: none; cursor: pointer; white-space: nowrap;
      padding: 10px 14px 9px; font-family: inherit; font-size: 14.5px; font-weight: 800;

    .tab:hover { color: var(--parchment); }

    .ov-card { background: linear-gradient(180deg, rgba(6, 28, 46, 0.94), rgba(3, 12, 20, 0.94)); border: 1px solid var(--border); border-radius: 16px; padding: 20px; animation: rise 0.5s var(--ease) both; min-width: 0; }

    .ov-sum i.up { background: var(--good); } .ov-sum i.down { background: var(--bad); } .ov-sum i.warn { background: var(--warn); } .ov-sum i.gold { background: var(--gold); }

    .ov-bars { display: flex; flex-direction: column; gap: 11px; }
    .ov-row { display: grid; grid-template-columns: 96px 1fr 92px; gap: 10px; align-items: center; font-size: 13.5px; }

    .ov-row .tr { height: 10px; background: rgba(233,238,243,.08); border-radius: 6px; overflow: hidden; }
    :root[data-theme="light"] .ov-row .tr { background: rgba(14,21,38,.08); }
    .ov-row .tr i { display: block; height: 100%; border-radius: 6px; background: var(--gold); }
    .ov-row.good .tr i { background: var(--good); } .ov-row.warn .tr i { background: var(--warn); } .ov-row.bad .tr i { background: var(--bad); }
    .ov-row .vl { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; direction: ltr; text-align: end; white-space: nowrap; }

    .ov-chart { width: 100%; height: auto; display: block; direction: ltr; touch-action: pan-y; }

    .ov-chart .ax { fill: var(--dimmer); font: 600 11px 'Tajawal', sans-serif; }
    .ov-chart .vl { stroke: var(--dimmer); stroke-width: 1; stroke-dasharray: 3 3; }
    #ovTip { position: fixed; z-index: 120; pointer-events: none; background: #0e1526; color: #fff; border-radius: 10px; padding: 8px 11px; font-size: 12.5px; line-height: 1.6; box-shadow: 0 6px 22px rgba(0,0,0,.35); max-width: 220px; }
    :root[data-theme="dark"] #ovTip { background: #e9eef3; color: #0e1526; }
    #ovTip b { display: block; font-weight: 800; }


    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--border-soft); margin-inline-end: 7px; }
    .dot.on { background: var(--good); } .dot.mid { background: var(--warn); }

  <div id="toasts" aria-live="polite"></div>
  <div id="ovTip" hidden></div>

  <script src="./supabase-config.js"></script>
  <script>
    "use strict";

    /* ────────────────────────────────────────────────────────────────
       تنبيه أمان مهم (لسه قايم من النسخة القديمة):
       شرط ADMIN_EMAILS.includes بينفّذ في المتصفح بس. أي حد يفتح الـ
       Console يقدر يتخطاه ويشوف قايمة إيميلات الأدمن. الحماية الحقيقية
       لازم تكون Row Level Security على جدول subscriptions في Supabase:
         • المستخدم العادي: SELECT على صفّه هو بس، ومفيش UPDATE خالص.
         • الأدمن: INSERT/UPDATE/DELETE عن طريق policy بتتحقق من
           auth.jwt() ->> 'email' أو من custom claim، مش من قايمة
           في ملف JS.
       من غير كده أي مستخدم يقدر يفعّل اشتراكه بنفسه مجاناً.
       ──────────────────────────────────────────────────────────────── */

    // كلاينت منفصل للأدمن بمفتاح تخزين خاص: كده تسجيل دخول أي مستخدم عادي
    // في تاب تاني (login.html) مايمسحش ولا يستبدل جلسة الأدمن.
    const adminClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { storageKey: "axiom-admin-auth", persistSession: true, autoRefreshToken: true }
    });

    const $ = (id) => document.getElementById(id);
    const DAY = 86400000;

    const gate = $("gate");
    const dashboard = $("dashboard");
    const gMsg = $("gMsg");
    const rowsEl = $("rows");
    const emptyEl = $("empty");

    let allRows = [];
    let sortKey = "created_at";
    let sortDir = "desc";
    let extTargetId = null;
    let extTargetExpiry = null;
    let lastFocused = null;
    let deviceErrShown = false;

    /* ===================== utilities ===================== */

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function toast(text, kind = "") {
      const box = $("toasts");
      const el = document.createElement("div");
      el.className = "toast" + (kind ? " " + kind : "");
      el.textContent = text;
      box.appendChild(el);
      setTimeout(() => {
        el.classList.add("out");
        el.addEventListener("animationend", () => el.remove(), { once: true });
      }, 3200);
    }

    function statusOf(row) {
      if (!row.active) return "inactive";
      if (row.expires_at && new Date(row.expires_at).getTime() < Date.now()) return "expired";
      return "active";
    }

    function daysLeft(row) {
      if (!row.expires_at) return null;
      return Math.ceil((new Date(row.expires_at).getTime() - Date.now()) / DAY);
    }

    function fmtDate(d) {
      if (!d) return "—";
      const date = new Date(d);
      return isNaN(date) ? "—" : date.toLocaleDateString("ar-EG", { year: "numeric", month: "short", day: "numeric" });
    }

    function fmtDateTime(d) {
      const date = new Date(d);
      return isNaN(date) ? "—" : date.toLocaleString("ar-EG", { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function relTime(d) {
      const diff = Date.now() - new Date(d).getTime();
      if (isNaN(diff)) return "—";
      const m = Math.floor(diff / 60000);
      if (m < 1) return "دلوقتي";
      if (m < 60) return `من ${m} دقيقة`;
      const h = Math.floor(m / 60);
      if (h < 24) return `من ${h} ساعة`;
      return `من ${Math.floor(h / 24)} يوم`;
    }

    function parseDeviceFromUserAgent(ua) {
      const text = String(ua || "");
      let os = "نظام غير معروف";
      let type = "Desktop";
      let browser = "متصفح غير معروف";
      let model = "";

      if (/Android/i.test(text)) {
        const m = text.match(/Android\s+([0-9._]+)/i);
        os = m ? `Android ${m[1].replace(/_/g, ".")}` : "Android";
        type = /Mobile/i.test(text) ? "Mobile" : "Tablet";
        const mm = text.match(/Android[^;)]*;\s*(?:wv;\s*)?([^;)]+?)(?:\s+Build\/[^;)]+)?[;)]/i);
        if (mm && mm[1]) model = mm[1].trim();
      } else if (/iPhone|iPod/i.test(text)) {
        os = "iOS"; type = "Mobile"; model = "iPhone";
      } else if (/iPad/i.test(text)) {
        os = "iPadOS"; type = "Tablet"; model = "iPad";
      } else if (/Windows/i.test(text)) {
        os = "Windows"; type = "Desktop";
      } else if (/Mac OS X|Macintosh/i.test(text)) {
        os = "macOS"; type = "Desktop";
      } else if (/Linux/i.test(text)) {
        os = "Linux"; type = "Desktop";
      }

      if (/Edg\//i.test(text)) browser = "Edge";
      else if (/OPR\//i.test(text)) browser = "Opera";
      else if (/SamsungBrowser/i.test(text)) browser = "Samsung Internet";
      else if (/Firefox\//i.test(text)) browser = "Firefox";
      else if (/CriOS\//i.test(text) || /Chrome\//i.test(text)) browser = "Chrome";
      else if (/Safari\//i.test(text) && !/Chrome|Chromium|CriOS|Edg|OPR/i.test(text)) browser = "Safari";

      if (!model) {
        if (type === "Desktop") model = os;
        else if (type === "Tablet") model = "Tablet";
        else if (/Android/i.test(os)) model = "Android Device";
        else if (/iOS/i.test(os)) model = "iPhone";
      }

      return {
        name: model,
        type,
        os,
        browser,
        model: model || null,
        user_agent: text
      };
    }

    // اسم مفهوم للعرض لو معندناش device_name/موديل صريح، لكن عندنا نوع/نظام معروف
    function fallbackDeviceName(type, os) {
      const t = String(type || ""), o = String(os || "");
      if (/Android/i.test(o)) return "Android Device";
      if (/iPadOS/i.test(o)) return "iPad";
      if (/iOS/i.test(o)) return "iPhone";
      if (/Windows/i.test(o)) return "Windows PC";
      if (/macOS/i.test(o)) return "Mac";
      if (/Linux/i.test(o)) return "Linux PC";
      if (t) return t === "Mobile" ? "Mobile Device" : t === "Tablet" ? "Tablet" : "Desktop";
      return "";
    }

    // ترتيب الأولوية للمعلومات المعروضة (مش لحالة "مسجّل فعليًا"، دي بتيجي من
    // user_devices بس وبتتحفظ زي ما هي عن طريق spread(d) تحت):
    //   1) security_logs.metadata
    //   2) security_logs.user_agent (بيتحلل هنا)
    //   3) user_devices (الحقول القديمة المخزّنة عليه لو موجودة)
    //   4) fallback من تحليل أي user_agent قديم في user_devices نفسه
    function normalizeDevice(d, log) {
      d = d || {};
      const meta = log?.metadata && typeof log.metadata === "object" ? log.metadata : {};
      const logUaInfo = log?.user_agent ? parseDeviceFromUserAgent(log.user_agent) : null;
      const dUaInfo = !logUaInfo && d.user_agent ? parseDeviceFromUserAgent(d.user_agent) : null;
      const uaInfo = logUaInfo || dUaInfo || { name: "", type: "", os: "", browser: "", model: "" };

      const device_type = meta.device_type || logUaInfo?.type || d.device_type || uaInfo.type || "";
      const os = meta.os || logUaInfo?.os || d.os || uaInfo.os || "";
      const browser = meta.browser || logUaInfo?.browser || d.browser || uaInfo.browser || "";
      const device_model = meta.device_model || meta.model || logUaInfo?.model || d.model || uaInfo.model || "";
      const device_name = meta.device_name || d.device_name || device_model ||
        fallbackDeviceName(device_type, os) || uaInfo.name || "جهاز غير معروف";
      const user_agent = log?.user_agent || d.user_agent || "";

      return {
        ...d,
        device_name,
        device_type,
        device_model: device_model || null,
        model: device_model || null, // للتوافق مع أي كود قديم بيقرا model
        os,
        browser,
        user_agent
      };
    }

    function deviceCell(row) {
      const d = row.device;               // معلومات العرض (من log/metadata/UA)، ممكن توجد من غير جهاز مسجّل
      const registered = row.registeredDevice; // الصف الفعلي من user_devices، أو null

      if (!d && !registered) return '<span class="days none">لسه ماسجّلش</span>';

      const name = escapeHtml(d?.device_name || "جهاز غير معروف");
      const type = escapeHtml(d?.device_type || "");
      const os = escapeHtml(d?.os || "");
      const browser = escapeHtml(d?.browser || "");
      const details = [type, os, browser].filter(Boolean).join(" • ");
      const icon = /Mobile|iPhone|Android/i.test(d?.device_type || d?.os || "")
        ? "📱"
        : /Tablet|iPad/i.test(d?.device_type || d?.os || "")
          ? "▣"
          : "💻";

      // is_active بيجي حصريًا من user_devices، مش من وجود log
      let sub;
      if (registered && registered.is_active) {
        sub = `<small>${details || `اتسجّل ${fmtDate(registered.first_seen_at)}`}</small>`;
      } else if (registered && !registered.is_active) {
        sub = `<small class="reset-tag">اتعمله Reset</small>`;
      } else {
        // فيه معلومات جهاز جاية من السجلات، لكن مفيش جهاز مسجّل فعليًا في user_devices
        sub = `<small>${details}</small><small class="info-tag">مش مسجّل كجهاز نشط</small>`;
      }
      return `<div class="dev"><b title="${name}">${icon} ${name}</b>${sub}</div>`;
    }

    function lastSeenCell(row) {
      const d = row.device;
      if (!d || !d.last_seen_at) return '<span class="days none">—</span>';
      const _t = new Date(d.last_seen_at).getTime(), _age = Date.now() - _t;
      const _dot = `<span class="dot${_t && _age < DAY ? " on" : _t && _age < 7 * DAY ? " mid" : ""}"></span>`;
      return `<div class="dev"><b>${_dot}${escapeHtml(relTime(d.last_seen_at))}</b><small>${escapeHtml(fmtDateTime(d.last_seen_at))}</small></div>`;
    }

    // عدّاد بيتحرك للرقم الجديد بدل ما ينطّ فجأة
    function animateNumber(el, target) {
      const from = parseInt(el.textContent, 10) || 0;
      if (from === target) return;
      const start = performance.now();
      const dur = 500;
      function tick(now) {
        const t = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(from + (target - from) * eased);
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    /* ===================== modals ===================== */

    function openModal(id) {
      lastFocused = document.activeElement;
      const ov = $(id);
      ov.classList.add("show");
      const first = ov.querySelector("input, select, button");
      if (first) setTimeout(() => first.focus(), 60);
    }

    function closeModal(id) {
      $(id).classList.remove("show");
      if (lastFocused) lastFocused.focus();
    }

    document.querySelectorAll(".overlay").forEach((ov) => {
      ov.addEventListener("click", (e) => { if (e.target === ov) closeModal(ov.id); });
    });

    // ESC بيقفل المودال المفتوح، و Tab بيفضل جوّاه
    document.addEventListener("keydown", (e) => {
      const open = document.querySelector(".overlay.show");
      if (!open) return;
      if (e.key === "Escape") { closeModal(open.id); return; }
      if (e.key !== "Tab") return;
      const f = [...open.querySelectorAll("input, select, button")].filter((el) => !el.disabled);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    let confirmResolve = null;
    function askConfirm(text) {
      $("confirmText").textContent = text;
      openModal("confirmOverlay");
      return new Promise((resolve) => { confirmResolve = resolve; });
    }
    $("confirmYes").onclick = () => { closeModal("confirmOverlay"); confirmResolve?.(true); confirmResolve = null; };
    $("confirmNo").onclick  = () => { closeModal("confirmOverlay"); confirmResolve?.(false); confirmResolve = null; };

    /* ===================== gate ===================== */

    async function boot() {
      try {
        const { data: { session } } = await adminClient.auth.getSession();
        if (session && await isAdminUser(session.user)) {
          showDashboard(session.user.email);
        }
      } catch (err) {
        console.error(err);
      }
    }

    // بيرجّع الجلسة لو لسه أدمن، وإلا بيرجّع للبوابة برسالة واضحة
    // (بدل ما الجدول يفضى بصمت لأن RLS بترجّع قايمة فاضية من غير error)
    async function ensureAdminSession() {
      const { data: { session } } = await adminClient.auth.getSession();
      if (!session) { showGate("الجلسة انتهت، سجّل دخول تاني"); return null; }
      if (!(await isAdminUser(session.user))) {
        showGate("المتصفح اتسجّل فيه بحساب تاني (" + session.user.email + ")، سجّل دخول بحساب الأدمن");
        return null;
      }
      return session;
    }

    function showGate(message) {
      allRows = [];
      dashboard.hidden = true;
      gate.hidden = false;
      gate.style.display = "";
      gMsg.textContent = message || "";
    }

    // لو حد سجّل دخول/خروج في تاب تاني في نفس المتصفح، الجلسة بتتبدّل
    // (نفس localStorage) — ده غالباً سبب اختفاء الحسابات.
    adminClient.auth.onAuthStateChange((event, session) => {
      if (dashboard.hidden) return;
      if (event === "SIGNED_OUT" || !session) {
        showGate("الجلسة انتهت، سجّل دخول تاني");
      } else if (event === "SIGNED_IN") {
        // مش بنعمل await جوّه الـcallback ده عشان مانعطّلش مكتبة supabase
        setTimeout(async () => {
          if (!(await isAdminUser(session.user))) showGate("اتعمل دخول بحساب تاني في نفس المتصفح، سجّل دخول بحساب الأدمن");
        }, 0);
      }
    });

    $("gateForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("gBtn");
      const email = $("gEmail").value.trim();
      const password = $("gPassword").value;
      gMsg.textContent = "";

      if (!email || !password) {
        gMsg.textContent = "اكتب الإيميل وكلمة المرور";
        gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
        return;
      }

      btn.disabled = true;
      btn.textContent = "بيتم الدخول...";
      try {
        const { data, error } = await adminClient.auth.signInWithPassword({ email, password });
        if (error) {
          gMsg.textContent = "بيانات الدخول غلط";
          gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
          return;
        }
        if (!(await isAdminUser(data.user))) {
          gMsg.textContent = "الحساب ده مش أدمن";
          await adminClient.auth.signOut();
          return;
        }
        showDashboard(data.user.email);
      } catch (err) {
        console.error(err);
        gMsg.textContent = "مفيش اتصال. جرّب تاني.";
      } finally {
        btn.disabled = false;
        btn.textContent = "دخول";
      }

    async function showDashboard(email) {
      gate.hidden = true;
      gate.style.display = "none";
      dashboard.hidden = false;
      $("whoami").textContent = email || "";
      await loadRows();
    }

    $("logoutBtn").onclick = async () => {
      await adminClient.auth.signOut();
      window.location.href = "./login.html";
    };

    /* ===================== data ===================== */

    function skeleton(n = 4) {
      const cell = (w) => `<td><span class="sk" style="width:${w}"></span></td>`;
      let html = "";
      for (let i = 0; i < n; i++) {
        html += "<tr>" + cell("70%") + cell("52px") + cell("110px") + cell("96px") + cell("96px") + cell("150px") + "</tr>";
      }
      return html;
    }

    async function attachDevices(rows) {
      const { data, error } = await adminClient.from("user_devices")
        .select("user_id,device_name,is_active,first_seen_at,last_seen_at")
        .order("last_seen_at", { ascending: false });
      if (error) {
        console.error(error);
        if (!deviceErrShown) { deviceErrShown = true; toast("مش قادرين نقرا بيانات الأجهزة: " + error.message, "err"); }
        rows.forEach((r) => { r.registeredDevice = null; r.device = null; });
        return;
      }
      if (!data.length && rows.length && !deviceErrShown) {
        deviceErrShown = true;
        toast("مفيش بيانات أجهزة راجعة — لو المفروض فيه، راجع صلاحية SELECT للأدمن على user_devices", "err");
      }
      const map = new Map();
      for (const d of data) {
        const cur = map.get(d.user_id);
        if (!cur || (d.is_active && !cur.is_active)) map.set(d.user_id, d);
      }
      // registeredDevice = الجهاز الفعلي المسجّل في user_devices (أو null).
      // is_active وتوقيتات first_seen/last_seen بتيجي من هنا حصريًا، مش من الـlogs.
      rows.forEach((r) => { r.registeredDevice = map.get(r.id) || null; r.device = null; });

      // نستخدم آخر دخول ناجح/تسجيل جهاز لتحسين معلومات العرض (اسم/نوع/نظام/متصفح)
      // فقط. وجود log لوحده مايعتبرش "جهاز مسجّل" — ده فرق واضح عن registeredDevice.
      try {
        // مقيّد بمستخدمي الصفحة الحالية ومقسّم دفعات: بدل ما نسحب كل اللوجات
        // (والـ API بيقطعها عند 1000 صف بصمت فمستخدمين بيفقدوا بيانات الجهاز).
        const ids = rows.map((r) => r.id);
        const chunks = [];
        for (let i = 0; i < ids.length; i += 40) chunks.push(ids.slice(i, i + 40));
        const results = await Promise.all(chunks.map((c) => adminClient
          .from("security_logs")
          .select("user_id,event_type,user_agent,metadata,created_at")
          .in("user_id", c)
          .in("event_type", ["login_success", "device_registered"])
          .order("created_at", { ascending: false })
          .limit(400)));
        const logError = results.find((r) => r.error)?.error || null;
        const logs = results.flatMap((r) => r.data || [])
          .sort((x, y) => (y.created_at > x.created_at ? 1 : -1));

        if (!logError) {
          const logMap = new Map();
          for (const log of logs) {
            if (!logMap.has(log.user_id)) logMap.set(log.user_id, log);
          }
          rows.forEach((r) => {
            const log = logMap.get(r.id);
            if (log || r.registeredDevice) r.device = normalizeDevice(r.registeredDevice, log || null);
          });
        } else {
          rows.forEach((r) => { if (r.registeredDevice) r.device = normalizeDevice(r.registeredDevice, null); });
        }
      } catch (_) {
        rows.forEach((r) => { if (r.registeredDevice) r.device = normalizeDevice(r.registeredDevice, null); });
      }
    }

    async function loadRows() {
      const btn = $("refreshBtn");
      btn.classList.add("spinning");
      btn.disabled = true;
      rowsEl.innerHTML = skeleton();
      emptyEl.hidden = true;

      try {
        if (!(await ensureAdminSession())) return;

        const { data, error } = await adminClient
          .from("subscriptions")
          .select("id,email,active,created_at,expires_at,plan")
          .order("created_at", { ascending: false });

        if (error) {
          rowsEl.innerHTML = `<tr><td colspan="6" class="muted">حصل خطأ: ${escapeHtml(error.message)}</td></tr>`;
          toast("مش قادرين نحمّل البيانات", "err");
          return;
        }
        // RLS بترجّع [] من غير error لو الجلسة/الصلاحية بايظة.
        // لو كان عندنا بيانات قبل كده وفجأة جت فاضية، منمسحش الشاشة.
        if ((!data || !data.length) && allRows.length > 1) {
          toast("السيرفر رجّع قايمة فاضية — راجع صلاحيات RLS أو سجّل دخول تاني", "err");
          render();
          return;
        }
        allRows = data || [];
        await attachDevices(allRows);
        render();
      } catch (err) {
        console.error(err);
        rowsEl.innerHTML = `<tr><td colspan="6" class="muted">مفيش اتصال بالسيرفر.</td></tr>`;
        toast("مفيش اتصال بالسيرفر", "err");
      } finally {
        btn.classList.remove("spinning");
        btn.disabled = false;
      }
    }

    /* ===================== search / filter / sort ===================== */

    let searchDebounce;
    $("search").oninput = () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(render, 200);
    };
    $("filter").onchange = render;

    document.querySelectorAll("th.sortable").forEach((th) => {
      th.onclick = () => {
        const key = th.dataset.sort;
        sortDir = sortKey === key && sortDir === "desc" ? "asc" : "desc";
        sortKey = key;
        document.querySelectorAll("th.sortable").forEach((o) => o.removeAttribute("aria-sort"));
        th.setAttribute("aria-sort", sortDir === "asc" ? "ascending" : "descending");
        const v = sortKey + ":" + sortDir;
        if ([...$("sortSel").options].some((o) => o.value === v)) $("sortSel").value = v;
        render();
      };
    });

    // الترتيب من القايمة (شغّال على الموبايل كمان حيث الهيدر مخفي)
    $("sortSel").onchange = () => {
      [sortKey, sortDir] = $("sortSel").value.split(":");
      document.querySelectorAll("th.sortable").forEach((o) => {
        if (o.dataset.sort === sortKey) o.setAttribute("aria-sort", sortDir === "asc" ? "ascending" : "descending");
        else o.removeAttribute("aria-sort");
      });
      render();
    };

    function sortRows(list) {
      const dir = sortDir === "asc" ? 1 : -1;
      return [...list].sort((a, b) => {
        let va, vb;
        if (sortKey === "email") return a.email.localeCompare(b.email, "en") * dir;
        if (sortKey === "last_seen") {
          va = a.device?.last_seen_at ? new Date(a.device.last_seen_at).getTime() : null;
          vb = b.device?.last_seen_at ? new Date(b.device.last_seen_at).getTime() : null;
          if (va === null) return 1;
          if (vb === null) return -1;
        } else if (sortKey === "days") {
          // الصفوف من غير تاريخ انتهاء بتتحط في الآخر دايماً
          va = daysLeft(a); vb = daysLeft(b);
          if (va === null) return 1;
          if (vb === null) return -1;
        } else {
          va = a[sortKey] ? new Date(a[sortKey]).getTime() : 0;
          vb = b[sortKey] ? new Date(b[sortKey]).getTime() : 0;
        }
        return (va - vb) * dir;
      });
    }

    /* ===================== render ===================== */

    const BADGES = {
      active:   '<span class="badge active">مفعّل</span>',
      expired:  '<span class="badge expired">منتهي</span>',
      inactive: '<span class="badge inactive">موقوف</span>',
    };

    function render() {
      const q = $("search").value.trim().toLowerCase();
      const f = $("filter").value;

      const total = allRows.length;
      const active = allRows.filter((r) => statusOf(r) === "active").length;
      const soon = allRows.filter((r) => {
        const d = daysLeft(r);
        return statusOf(r) === "active" && d !== null && d <= 7;
      }).length;

      animateNumber($("stTotal"), total);
      animateNumber($("stActive"), active);
      animateNumber($("stSoon"), soon);
      animateNumber($("stOff"), total - active);

      const list = sortRows(allRows.filter((r) => {
        if (q && !(String(r.email || "") + " " + String(r.device?.device_name || "")).toLowerCase().includes(q)) return false;
        if (f !== "all" && statusOf(r) !== f) return false;
        return true;
      }));

      curList = list;
      $("count").textContent = total ? `${list.length} من ${total}` : "";

      rowsEl.innerHTML = "";
      if (!list.length) {
        emptyEl.hidden = false;
        emptyEl.textContent = total ? "مفيش نتائج مطابقة للبحث." : "مفيش مستخدمين مسجّلين لسه.";
        return;
      }
      emptyEl.hidden = true;

      const frag = document.createDocumentFragment();
      list.forEach((row, i) => {
        const st = statusOf(row);
        const d = daysLeft(row);
        let daysHtml;
        if (d === null) daysHtml = '<span class="days none">غير محدد</span>';
        else if (d < 0)  daysHtml = `<span class="days over">منتهي من ${Math.abs(d)} يوم</span>`;
        else if (d <= 7) daysHtml = `<span class="days soon">${d} يوم</span>`;
        else             daysHtml = `<span class="days ok">${d} يوم</span>`;

        const subHtml = d === null
          ? '<span class="days none">بدون تاريخ انتهاء</span>'
          : `<div class="dev"><b>${fmtDate(row.expires_at)}</b>${daysHtml}</div>`;

        const tr = document.createElement("tr");
        tr.style.animationDelay = Math.min(i * 22, 300) + "ms";
        tr.innerHTML = `
          <td class="acct">
            <div class="acct-email">${escapeHtml(row.email)} <button type="button" class="copy-btn" data-copy="${escapeHtml(row.email)}" title="نسخ الإيميل" aria-label="نسخ الإيميل">نسخ</button></div>
            <div class="acct-meta">
              ${row.plan ? `<span class="chip">${escapeHtml(row.plan)}</span>` : ""}
              <span>سجّل ${fmtDate(row.created_at)}</span>
            </div>
          </td>
          <td class="col-status">${BADGES[st]}</td>
          <td data-label="الجهاز">${deviceCell(row)}</td>
          <td data-label="آخر دخول">${lastSeenCell(row)}</td>
          <td data-label="الاشتراك">${subHtml}</td>
          <td class="actions-cell">
            <div class="actions">
              <button class="mini ${row.active ? "off" : "on"}" data-act="toggle" data-id="${escapeHtml(row.id)}" data-active="${row.active}">
                ${row.active ? "إيقاف" : "تفعيل"}
              </button>
              <button class="mini ext" data-act="extend" data-id="${escapeHtml(row.id)}"
                      data-email="${escapeHtml(row.email)}" data-exp="${escapeHtml(row.expires_at || "")}">تمديد</button>
              <button class="mini reset" data-act="resetDevice" data-id="${escapeHtml(row.id)}"
                      data-email="${escapeHtml(row.email)}">Reset Device</button>
              <button class="mini del" data-act="del" data-id="${escapeHtml(row.id)}" data-email="${escapeHtml(row.email)}">حذف</button>
            </div>
          </td>`;
        frag.appendChild(tr);
      });
      rowsEl.appendChild(frag);
    }

    // event delegation: أسرع من ربط onclick لكل زرار في كل render
    rowsEl.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-act]");
      if (btn) handleAction(btn);
    });

    /* ===================== actions ===================== */

    async function handleAction(btn) {
      const id = btn.dataset.id;
      const act = btn.dataset.act;

      if (act === "toggle") {
        const current = btn.dataset.active === "true";
        btn.disabled = true;
        btn.textContent = "...";
        const { data: upd, error } = await adminClient.from("subscriptions")
          .update({ active: !current }).eq("id", id).select("id");
        if (error) { toast("مش قادرين نغيّر الحالة: " + error.message, "err"); btn.disabled = false; return; }
        if (!upd || !upd.length) { toast("التعديل ماتنفّذش (غالباً صلاحيات RLS)", "err"); btn.disabled = false; btn.textContent = current ? "إيقاف" : "تفعيل"; return; }
        toast(current ? "تم إيقاف الاشتراك" : "تم تفعيل الاشتراك", "ok");
        await loadRows();
      }

      if (act === "extend") {
        extTargetId = id;
        extTargetExpiry = btn.dataset.exp || null;
        $("extEmail").textContent = btn.dataset.email;
        $("extDays").value = "";
        $("extMsg").textContent = "";
        $("extPreview").textContent = "";
        document.querySelectorAll("#extQuick button").forEach((b) => b.classList.remove("sel"));
        openModal("extOverlay");
      }

      if (act === "resetDevice") {
        const ok = await askConfirm(
          `متأكد إنك عايز تعمل Reset Device لحساب ${btn.dataset.email}؟ ` +
          `الجهاز الحالي هيتفك، وأول جهاز يدخل بعد كده هيتسجّل كالجهاز الجديد.`
        );
        if (!ok) return;

        btn.disabled = true;
        const prevText = btn.textContent;
        btn.textContent = "...";

        try {
          if (!(await ensureAdminSession())) return;

          const { data: result, error } = await adminClient.rpc(
            "reset_user_devices",
            { p_target_user_id: id }
          );

          if (error || !result || result.success !== true) {
            console.error("RESET DEVICE ERROR:", error || result);
            toast(
              "Reset Device فشل: " +
              (error?.message || result?.reason || "خطأ غير معروف"),
              "err"
            );
            return;
          }

          toast(
            "تم Reset Device بنجاح — الجهاز القديم اتفك، وأول جهاز يدخل هيتسجّل",
            "ok"
          );

          await loadRows();
        } catch (err) {
          console.error("RESET DEVICE EXCEPTION:", err);
          toast("حصل خطأ أثناء Reset Device", "err");
        } finally {
          btn.disabled = false;
          btn.textContent = prevText;
        }
      }

      if (act === "del") {
        const ok = await askConfirm(`متأكد إنك عايز تحذف ${btn.dataset.email}؟ الخطوة دي مش بترجع.`);
        if (!ok) return;

        const tr = btn.closest("tr");
        btn.disabled = true;
        const oldText = btn.textContent;
        btn.textContent = "...";

        try {
          if (!(await ensureAdminSession())) return;

          const { data: result, error } = await adminClient.rpc(
            "delete_user_completely",
            {
              p_target_user_id: id
            }
          );

          if (error) {
            console.error("DELETE RPC ERROR:", error);
            toast("مش قادرين نحذف: " + error.message, "err");
            return;
          }

          if (!result || result.success !== true) {
            console.error("DELETE RPC RESULT:", result);
            toast(
              "الحذف فشل: " + (result?.reason || "خطأ غير معروف"),
              "err"
            );
            return;
          }

          toast(
            `تم الحذف — الأجهزة: ${result.deleted_devices ?? 0} | الاشتراك: ${result.deleted_subscriptions ?? 0}`,
            "ok"
          );

          tr.classList.add("removing");
          tr.addEventListener("animationend", loadRows, { once: true });
        } catch (err) {
          console.error("DELETE ERROR:", err);
          toast("مفيش اتصال بالسيرفر أو حصل خطأ غير متوقع", "err");
        } finally {
          btn.disabled = false;
          btn.textContent = oldText;
        }
      }
    }

    $("addConfirm").onclick = async () => {

    /* ===================== export ===================== */

    $("exportBtn").onclick = () => {
      if (!allRows.length) { toast("مفيش بيانات للتصدير"); return; }
      const head = ["email", "status", "plan", "created_at", "expires_at", "days_left", "device_name", "device_type", "device_model", "os", "browser", "user_agent", "device_state", "last_seen_at"];
      // CSV/Formula injection guard: device_name & user_agent are client-controlled,
      // so a cell starting with = + - @ would run as a formula when opened in Excel.
      const esc = (v) => {
        let s = String(v ?? "");
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
        return `"${s.replace(/"/g, '""')}"`;
      };
      const lines = [head.join(",")].concat(
        allRows.map((r) => [r.email, statusOf(r), r.plan, r.created_at, r.expires_at, daysLeft(r) ?? "",
          r.device?.device_name, r.device?.device_type, r.device?.device_model, r.device?.os, r.device?.browser, r.device?.user_agent,
          r.registeredDevice ? (r.registeredDevice.is_active ? "active" : "reset") : "", r.registeredDevice?.last_seen_at]
          .map(esc).join(","))
      );
      // BOM عشان Excel يقرا العربي صح
      const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `axiom-subscriptions-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast("تم تصدير الملف", "ok");
    };

    $("refreshBtn").onclick = loadRows;

    /* ================================================================
       إضافات مستوحاة من لوحة Apex: تبويبات، مظهر فاتح/داكن/تلقائي،
       تحديث تلقائي، نظرة عامة بالرسوم، ملخّص ذكي، ومؤشر اتجاه.
       ================================================================ */
    const ovNum = new Intl.NumberFormat("ar-u-nu-latn", { maximumFractionDigits: 1 });
    const ovFmt = (v) => (v == null || !Number.isFinite(Number(v))) ? "—" : ovNum.format(Number(v));
    const OV_NS = "http://www.w3.org/2000/svg";
    function ovEl(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
    function ovSv(tag, attrs, txt) { const e = document.createElementNS(OV_NS, tag); for (const k in (attrs || {})) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; }
    const pad2 = (n) => String(n).padStart(2, "0");
    function dayKey(t) { const d = new Date(t); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
    function dayLabel(k) { const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(k); return m ? (+m[2]) + "/" + (+m[1]) : k; }
    function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1e-9)))), f = x / p; return Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p); }

    /* ---------- theme ---------- */
    const THEME_ORDER = ["dark", "light", "auto"];
    const THEME_LABEL = { dark: "🌙 داكن", light: "☀ فاتح", auto: "◐ تلقائي" };
    function getThemeMode() { let m = "dark"; try { m = localStorage.getItem("axiomAdminTheme") || "dark"; } catch (_) {} return THEME_ORDER.includes(m) ? m : "dark"; }
    function applyTheme(m) {
      const r = m === "auto" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : m;
      document.documentElement.setAttribute("data-theme", r);
      const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = r === "light" ? "#f3f5fa" : "#030C14";
      $("themeBtn").textContent = THEME_LABEL[m];
    }
    $("themeBtn").onclick = () => {
      const m = THEME_ORDER[(THEME_ORDER.indexOf(getThemeMode()) + 1) % THEME_ORDER.length];
      try { localStorage.setItem("axiomAdminTheme", m); } catch (_) {}
      applyTheme(m); toast("المظهر: " + THEME_LABEL[m].replace(/^\S+\s/, ""));
    };
    matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", () => { if (getThemeMode() === "auto") applyTheme("auto"); });
    applyTheme(getThemeMode());

    /* ---------- "آخر تحديث" + تحديث تلقائي ---------- */
    let lastUpdated = null;
    let autoOn = false, autoTimer = 0;
    function tickStamp() {
      const el = $("stamp");
      el.textContent = lastUpdated ? "آخر تحديث: " + relTime(lastUpdated) : "";
    }
    setInterval(tickStamp, 20000);

    const _loadRows = loadRows;
    loadRows = async function () {
      await _loadRows();
      lastUpdated = Date.now();
      tickStamp();
      renderOverview();
    };
    $("refreshBtn").onclick = loadRows;

    function setAuto(on) {
      autoOn = on;
      try { localStorage.setItem("axiomAdminAuto", on ? "1" : "0"); } catch (_) {}
      clearInterval(autoTimer);
      if (on) autoTimer = setInterval(() => {
        if (document.hidden || dashboard.hidden || $("refreshBtn").disabled || document.querySelector(".overlay.show")) return;
        loadRows();
      }, 60000);
      $("autoBtn").setAttribute("aria-pressed", on ? "true" : "false");
    }
    $("autoBtn").onclick = () => { setAuto(!autoOn); toast(autoOn ? "التحديث التلقائي كل دقيقة: شغّال" : "التحديث التلقائي: متوقف"); };
    try { setAuto(localStorage.getItem("axiomAdminAuto") === "1"); } catch (_) { setAuto(false); }

    /* ---------- تبويبات ---------- */
    let curTab = "subs";
    function setTab(t, fromHash) {
      if (t !== "subs" && t !== "overview") t = "subs";
      curTab = t;
      $("viewSubs").hidden = t !== "subs";
      $("viewOverview").hidden = t !== "overview";
      document.querySelectorAll("#tabs .tab").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"));
      if (!fromHash) history.replaceState(null, "", "#" + t);
      if (t === "overview") renderOverview();
      hideOvTip();
    }
    document.querySelectorAll("#tabs .tab").forEach((b) => { b.onclick = () => { setTab(b.dataset.tab); window.scrollTo(0, 0); }; });
    addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== curTab) setTab(h, true); });
    setTab((location.hash || "").slice(1) || "subs", true);

    /* ---------- tooltip ---------- */
    function showOvTip(x, y, title, lines) {
      const t = $("ovTip"); t.textContent = "";
      t.appendChild(ovEl("b", null, title)); lines.forEach((l) => t.appendChild(ovEl("div", null, l)));
      t.hidden = false;
      const w = t.offsetWidth, h = t.offsetHeight;
      let l = x + 14; if (l + w > innerWidth - 8) l = x - w - 14; l = Math.max(8, l);
      let tp = y - h - 12; if (tp < 8) tp = y + 18;
      t.style.left = l + "px"; t.style.top = tp + "px";
    }
    function hideOvTip() { $("ovTip").hidden = true; }

    /* ---------- bar chart (SVG) ---------- */
    function ovBarChart(items, color, unitLabel) {
      const W = 640, H = 210, pl = 34, pr = 10, pt = 14, pb = 28, n = items.length, iw = W - pl - pr, ih = H - pt - pb;
      const svg = ovSv("svg", { viewBox: "0 0 " + W + " " + H, class: "ov-chart", role: "img", "aria-label": unitLabel });
      const top = Math.max(1, ...items.map((x) => x.v)), step = niceStep(top / 4), mx = step * 4;
      const X = (i) => pl + (i + 0.5) * iw / n, Y = (v) => pt + ih * (1 - v / mx);
      for (let g = 0; g <= 4; g++) {
        const v = step * g, y = Y(v);
        svg.appendChild(ovSv("line", { x1: pl, x2: W - pr, y1: y, y2: y, class: "gl" }));
        svg.appendChild(ovSv("text", { x: pl - 6, y: y + 4, class: "ax", "text-anchor": "end" }, ovFmt(v)));
      }
      items.forEach((x, i) => {
        if (n > 10 && i % 4 !== 0 && i !== n - 1) return;
        svg.appendChild(ovSv("text", { x: X(i), y: H - 9, class: "ax", "text-anchor": "middle" }, dayLabel(x.d)));
      });
      const bw = Math.min(22, iw / n * 0.62);
      items.forEach((x, i) => svg.appendChild(ovSv("rect", { x: X(i) - bw / 2, y: Y(x.v), width: bw, height: Math.max(0, ih * x.v / mx), rx: 3, style: "fill:" + color })));
      const vl = ovSv("line", { y1: pt, y2: pt + ih, x1: 0, x2: 0, class: "vl", style: "display:none" }); svg.appendChild(vl);
      const hit = ovSv("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }); svg.appendChild(hit);
      const move = (ev) => {
        const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
        const i = Math.max(0, Math.min(n - 1, Math.floor((px - pl) / (iw / n))));
        vl.setAttribute("x1", X(i)); vl.setAttribute("x2", X(i)); vl.style.display = "";
        showOvTip(ev.clientX, ev.clientY, dayLabel(items[i].d), [unitLabel + ": " + ovFmt(items[i].v)]);
      };
      hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
      hit.addEventListener("pointerleave", () => { vl.style.display = "none"; hideOvTip(); });
      return svg;
    }

    function ovBarsList(entries, cls) {
      const total = entries.reduce((s, e) => s + e.v, 0), mx = Math.max(1, ...entries.map((e) => e.v));
      const box = ovEl("div", "ov-bars");
      entries.forEach((e) => {
        const r = ovEl("div", "ov-row" + (e.cls || cls ? " " + (e.cls || cls) : "")), tr = ovEl("div", "tr"), i = ovEl("i");
        i.style.width = (e.v / mx * 100) + "%"; tr.appendChild(i);
        r.appendChild(ovEl("span", "nm", e.name)); r.appendChild(tr);
        r.appendChild(ovEl("span", "vl", ovFmt(e.v) + " · " + ovFmt(total ? e.v / total * 100 : 0) + "%"));
        box.appendChild(r);
      });
      return box;
    }

    function ovCard(title, sub) {
      const c = ovEl("section", "ov-card"); c.appendChild(ovEl("h2", null, title));
      if (sub) c.appendChild(ovEl("div", "ov-sub", sub)); return c;
    }

    /* ---------- اتجاه المشتركين الجدد (آخر 7 أيام مقابل اللي قبلها) ---------- */
    function signupTrend() {
      const now = Date.now(), w = 7 * DAY;
      let cur = 0, prev = 0;
      for (const r of allRows) {
        const t = new Date(r.created_at).getTime(); if (isNaN(t)) continue;
        if (t >= now - w) cur++; else if (t >= now - 2 * w) prev++;
      }
      return { cur, prev, pct: prev ? (cur - prev) / prev * 100 : null };
    }

    function updateTrendChip() {
      const chip = $("stTrend"), t = signupTrend();
      if (!allRows.length || (!t.cur && !t.prev)) { chip.hidden = true; return; }
      chip.hidden = false;
      chip.title = "مشتركين جدد آخر 7 أيام مقارنةً بالـ7 أيام اللي قبلها";
      if (t.pct == null) { chip.className = "delta up"; chip.textContent = "+" + ovFmt(t.cur) + " جديد هذا الأسبوع"; return; }
      const p = Math.round(t.pct);
      chip.className = "delta " + (p > 0 ? "up" : p < 0 ? "down" : "");
      chip.textContent = (p > 0 ? "▲ " : p < 0 ? "▼ " : "") + ovFmt(Math.abs(p)) + "% جدد هذا الأسبوع";
    }

    /* ---------- نظرة عامة ---------- */
    function renderOverview() {
      updateTrendChip();
      $("tabCount").textContent = allRows.length ? ovFmt(allRows.length) : "";
      const root = $("viewOverview");
      if (curTab !== "overview") return;
      root.textContent = "";
      if (!allRows.length) { const c = ovCard("نظرة عامة"); c.appendChild(ovEl("div", "ov-empty", "مفيش بيانات لسه.")); root.appendChild(c); return; }

      const now = Date.now();
      const byStatus = { active: 0, expired: 0, inactive: 0 };
      const byPlan = new Map(), byDevice = new Map();
      let soon = 0, noDevice = 0;
      for (const r of allRows) {
        const st = statusOf(r); byStatus[st]++;
        const d = daysLeft(r); if (st === "active" && d !== null && d <= 7) soon++;
        const pl = r.plan || "بدون باقة"; byPlan.set(pl, (byPlan.get(pl) || 0) + 1);
        if (!r.registeredDevice) noDevice++;
        const dt = r.device?.device_type || "لسه ماسجّلش"; byDevice.set(dt, (byDevice.get(dt) || 0) + 1);
      }

      // ---- الملخص
      const sum = [], tr = signupTrend();
      if (tr.cur || tr.prev) {
        if (tr.pct == null) sum.push(["up", ovFmt(tr.cur) + " مشترك جديد في آخر 7 أيام (مفيش تسجيلات في الأسبوع اللي قبله)."]);
        else if (Math.abs(tr.pct) >= 1) sum.push([tr.pct > 0 ? "up" : "down", "التسجيلات الجديدة " + (tr.pct > 0 ? "زادت " : "قلّت ") + ovFmt(Math.abs(tr.pct)) + "% في آخر 7 أيام (" + ovFmt(tr.cur) + " مقابل " + ovFmt(tr.prev) + ")."]);
        else sum.push(["", "التسجيلات ثابتة تقريباً: " + ovFmt(tr.cur) + " في آخر 7 أيام."]);
      }
      if (soon) sum.push(["warn", ovFmt(soon) + " اشتراك مفعّل بينتهي خلال 7 أيام — فكّر تتواصل معاهم للتجديد."]);
      if (byStatus.expired) sum.push(["down", ovFmt(byStatus.expired) + " اشتراك انتهى ولسه متجدّدش."]);
      const topPlan = [...byPlan.entries()].sort((a, b) => b[1] - a[1])[0];
      if (topPlan) sum.push(["gold", "الباقة الأكثر انتشاراً: " + topPlan[0] + " (" + ovFmt(topPlan[1] / allRows.length * 100) + "% من المشتركين)."]);
      if (noDevice) sum.push(["", ovFmt(noDevice) + " مشترك لسه ماسجّلش أي جهاز."]);

      const todayK = dayKey(now);
      let sToday = 0, lToday = 0, eToday = 0;
      for (const r of allRows) {
        if (r.created_at && dayKey(r.created_at) === todayK) sToday++;
        if (r.registeredDevice?.last_seen_at && dayKey(r.registeredDevice.last_seen_at) === todayK) lToday++;
        if (statusOf(r) === "active" && r.expires_at && dayKey(r.expires_at) === todayK) eToday++;
      }
      const tc = ovCard("النهارده", "بتوقيت جهازك");
      const td = ovEl("div", "ov-today");
      [["تسجيلات جديدة", sToday], ["دخلوا النهارده", lToday], ["بينتهي اشتراكهم", eToday]].forEach(([n, v]) => {
        const x = ovEl("div"); x.appendChild(ovEl("b", null, ovFmt(v))); x.appendChild(ovEl("span", null, n)); td.appendChild(x);
      });
      tc.appendChild(td); root.appendChild(tc);

      const sc = ovCard("الخلاصة", "قراءة سريعة للوضع الحالي");
      if (sum.length) { const ul = ovEl("ul", "ov-sum"); sum.forEach(([c, t]) => { const li = ovEl("li"); li.appendChild(ovEl("i", c)); li.appendChild(ovEl("span", null, t)); ul.appendChild(li); }); sc.appendChild(ul); }
      else sc.appendChild(ovEl("div", "ov-empty", "مفيش ملاحظات حالياً."));
      root.appendChild(sc);

      // ---- رسوم
      const signups = [], expiries = [], idx = new Map(), idx2 = new Map();
      for (let i = 29; i >= 0; i--) { const k = dayKey(now - i * DAY); idx.set(k, signups.length); signups.push({ d: k, v: 0 }); }
      for (let i = 0; i < 30; i++) { const k = dayKey(now + i * DAY); idx2.set(k, expiries.length); expiries.push({ d: k, v: 0 }); }
      for (const r of allRows) {
        const c = r.created_at ? idx.get(dayKey(r.created_at)) : undefined; if (c !== undefined) signups[c].v++;
        if (statusOf(r) === "active" && r.expires_at) { const e = idx2.get(dayKey(r.expires_at)); if (e !== undefined) expiries[e].v++; }
      }
      const g1 = ovEl("div", "ov-grid");
      const c1 = ovCard("التسجيلات الجديدة", "آخر 30 يوم");
      c1.appendChild(signups.some((x) => x.v) ? ovBarChart(signups, "var(--gold)", "تسجيلات") : ovEl("div", "ov-empty", "مفيش تسجيلات في آخر 30 يوم."));
      const c2 = ovCard("اشتراكات هتنتهي", "الـ30 يوم الجايين (المفعّلة بس)");
      c2.appendChild(expiries.some((x) => x.v) ? ovBarChart(expiries, "var(--warn)", "هتنتهي") : ovEl("div", "ov-empty", "مفيش اشتراكات هتنتهي خلال 30 يوم."));
      g1.appendChild(c1); g1.appendChild(c2); root.appendChild(g1);

      // ---- توزيعات
      const g2 = ovEl("div", "ov-grid");
      const c3 = ovCard("حالة الاشتراكات", "توزيع المشتركين حسب الحالة");
      c3.appendChild(ovBarsList([
        { name: "مفعّل", v: byStatus.active, cls: "good" },
        { name: "منتهي", v: byStatus.expired, cls: "warn" },
        { name: "موقوف", v: byStatus.inactive, cls: "bad" }
      ]));
      const c4 = ovCard("الباقات", "توزيع المشتركين حسب الباقة");
      c4.appendChild(ovBarsList([...byPlan.entries()].sort((a, b) => b[1] - a[1]).map(([name, v]) => ({ name, v }))));
      g2.appendChild(c3); g2.appendChild(c4); root.appendChild(g2);

      const c5 = ovCard("الأجهزة", "نوع الجهاز المسجّل أو المعروف لكل مشترك");
      c5.appendChild(ovBarsList([...byDevice.entries()].sort((a, b) => b[1] - a[1]).map(([name, v]) => ({ name, v }))));
      root.appendChild(c5);
    }

    /* ================= الدفعة التانية: أمان + راحة استخدام ================= */

    // التحقق من الأدمن من السيرفر (دالة is_admin في Supabase). لو الدالة لسه
    // مش موجودة بنرجع للفحص القديم عشان اللوحة ماتقفش، لكن الحماية الحقيقية RLS.
    let adminRpcMissingWarned = false;
    async function isAdminUser(user) {
      if (!user) return false;
      try {
        const { data, error } = await adminClient.rpc("is_admin");
        if (!error && typeof data === "boolean") return data;
        if (error && !adminRpcMissingWarned) { adminRpcMissingWarned = true; console.warn("is_admin RPC غير متاحة، بنستخدم الفحص المحلي:", error.message); }
      } catch (_) {}
      return axiomIsAdmin(user);
    }

    let curList = [];

    async function copyText(txt) {
      try { await navigator.clipboard.writeText(txt); return true; }
      catch (_) {
        try { const a = document.createElement("textarea"); a.value = txt; a.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(a); a.select(); const ok = document.execCommand("copy"); a.remove(); return ok; }
        catch (__) { return false; }
      }
    }

    rowsEl.addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-copy]");
      if (!b) return;
      const ok = await copyText(b.dataset.copy);
      const old = b.textContent; b.textContent = ok ? "تم ✓" : "تعذّر";
      setTimeout(() => { b.textContent = old; }, 1300);
    });

    $("copyAllBtn").onclick = async () => {
      if (!curList.length) { toast("مفيش حاجة تتنسخ"); return; }
      toast((await copyText(curList.map((r) => r.email).join("\n"))) ? "اتنسخ " + curList.length + " إيميل" : "تعذّر النسخ", "ok");
    };

    $("jsonBtn").onclick = () => {
      if (!curList.length) { toast("مفيش بيانات للتنزيل"); return; }
      const data = curList.map((r) => ({
        email: r.email, status: statusOf(r), plan: r.plan || null, created_at: r.created_at, expires_at: r.expires_at,
        days_left: daysLeft(r), device_name: r.device?.device_name || null, last_seen_at: r.registeredDevice?.last_seen_at || null
      }));
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
      a.download = "axiom-subscriptions-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 500);
      toast("تم تنزيل الملف", "ok");
    };

    // شرائح الفلترة بعدد كل حالة (بتتزامن مع القايمة المخفية #filter)
    const CHIP_DEFS = [["all", "الكل"], ["active", "مفعّل"], ["expired", "منتهي"], ["inactive", "موقوف"]];
    function updateChips() {
      const box = $("chips"), cur = $("filter").value, counts = { all: allRows.length, active: 0, expired: 0, inactive: 0 };
      allRows.forEach((r) => { counts[statusOf(r)]++; });
      box.textContent = "";
      CHIP_DEFS.forEach(([k, label]) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = label + " · " + counts[k];
        b.setAttribute("aria-pressed", cur === k ? "true" : "false");
        b.onclick = () => { $("filter").value = k; render(); };
        box.appendChild(b);
      });
    }
    const _render = render;
    render = function () { _render(); updateChips(); };

    // شاشة الدخول: إظهار/إخفاء كلمة المرور + تذكّر آخر إيميل
    $("gEye").onclick = () => {
      const i = $("gPassword"), show = i.type === "password";
      i.type = show ? "text" : "password"; $("gEye").textContent = show ? "إخفاء" : "إظهار";
    };
    try { const saved = localStorage.getItem("axiomAdminEmail"); if (saved) $("gEmail").value = saved; } catch (_) {}
    $("gateForm").addEventListener("submit", () => {
      const v = $("gEmail").value.trim(); if (v) { try { localStorage.setItem("axiomAdminEmail", v); } catch (_) {} }
    });

    boot();
  </script>
</body>

</html>
